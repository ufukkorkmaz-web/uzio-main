<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uzio English</title>
<meta name="theme-color" content="#f2f2f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
@property --accent { syntax: '<color>'; inherits: true; initial-value: #007AFF; }

:root {
  color-scheme: light;
  --font: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --spring: cubic-bezier(.32, 1.25, .45, 1);
  --smooth: cubic-bezier(.32, .72, 0, 1);

  --bg: #f2f2f7;
  --card: #ffffff;
  --fg: #000000;
  --fg2: rgba(60, 60, 67, .62);
  --fill: rgba(120, 120, 128, .12);
  --fill2: rgba(120, 120, 128, .2);
  --sep: rgba(60, 60, 67, .14);

  --blue: #007AFF; --pink: #FF2D55; --green: #34C759; --purple: #AF52DE;
  --orange: #FF9500; --teal: #30B0C7; --indigo: #5856D6;

  --glass: rgba(255, 255, 255, .58);
  --glass-edge: rgba(255, 255, 255, .75);
  --spec: rgba(255, 255, 255, .95);
  --glass-shadow: 0 10px 34px rgba(30, 30, 60, .12), 0 1px 3px rgba(0, 0, 0, .06);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(30, 30, 60, .06);
  --wall: .34;
  --night: 0;
  --orb-shadow: rgba(40, 60, 150, .22);
  --accent: #007AFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000; --card: #1c1c1e; --fg: #fff;
    --fg2: rgba(235, 235, 245, .62);
    --fill: rgba(120, 120, 128, .24); --fill2: rgba(120, 120, 128, .36);
    --sep: rgba(84, 84, 88, .6);
    --blue: #0A84FF; --pink: #FF375F; --green: #30D158; --purple: #BF5AF2;
    --orange: #FF9F0A; --teal: #40C8E0; --indigo: #5E5CE6;
    --glass: rgba(58, 58, 62, .5); --glass-edge: rgba(255, 255, 255, .16); --spec: rgba(255, 255, 255, .28);
    --glass-shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .4);
    --card-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 10px 30px rgba(0, 0, 0, .4);
    --wall: .5; --night: 1; --orb-shadow: rgba(110, 130, 255, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000; --card: #1c1c1e; --fg: #fff;
  --fg2: rgba(235, 235, 245, .62);
  --fill: rgba(120, 120, 128, .24); --fill2: rgba(120, 120, 128, .36);
  --sep: rgba(84, 84, 88, .6);
  --blue: #0A84FF; --pink: #FF375F; --green: #30D158; --purple: #BF5AF2;
  --orange: #FF9F0A; --teal: #40C8E0; --indigo: #5E5CE6;
  --glass: rgba(58, 58, 62, .5); --glass-edge: rgba(255, 255, 255, .16); --spec: rgba(255, 255, 255, .28);
  --glass-shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .4);
  --card-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 10px 30px rgba(0, 0, 0, .4);
  --wall: .5; --night: 1; --orb-shadow: rgba(110, 130, 255, .3);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; transition: --accent 1s var(--smooth); }
body {
  margin: 0; min-height: 100vh;
  font-family: var(--font); font-size: 17px; line-height: 1.4;
  background: var(--bg); color: var(--fg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: clip;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 3px; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-old(root) { z-index: 1; }
::view-transition-new(root) { z-index: 2; }

/* ---------- Wallpaper ---------- */
.wallpaper { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.wallpaper i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(80px); opacity: var(--wall); }
.wallpaper i:nth-child(1) { left: -18vmax; top: -24vmax; background: radial-gradient(circle, var(--accent), transparent 66%); animation: drift1 30s ease-in-out infinite alternate; }
.wallpaper i:nth-child(2) { right: -20vmax; top: 4vmax; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 35%, var(--purple)), transparent 66%); animation: drift2 36s ease-in-out infinite alternate; }
.wallpaper i:nth-child(3) { left: 10vmax; bottom: -34vmax; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 40%, var(--teal)), transparent 66%); animation: drift3 33s ease-in-out infinite alternate; }
@keyframes drift1 { to { translate: 22vmax 14vmax; scale: 1.25; } }
@keyframes drift2 { to { translate: -22vmax 12vmax; scale: .85; } }
@keyframes drift3 { to { translate: 18vmax -12vmax; scale: 1.2; } }

/* ---------- Liquid glass material ---------- */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(30px) saturate(1.9);
  backdrop-filter: blur(30px) saturate(1.9);
  box-shadow:
    inset 0 0 0 .5px var(--glass-edge),
    inset 0 1.5px 0 var(--spec),
    inset 0 -1px 0 rgba(255, 255, 255, .08),
    var(--glass-shadow);
}

/* ---------- Top bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 60;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
}
.bar::before {
  content: ""; position: absolute; inset: 0 0 -26px; z-index: -1; pointer-events: none;
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  -webkit-mask-image: linear-gradient(#000 45%, transparent);
  mask-image: linear-gradient(#000 45%, transparent);
  background: linear-gradient(color-mix(in srgb, var(--bg) 80%, transparent), transparent);
  opacity: 0; transition: opacity .35s ease;
}
.bar.scrolled::before { opacity: 1; }

.brand { display: flex; align-items: center; gap: 10px; justify-self: start; text-decoration: none; color: var(--fg); font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent));
  color: #0b0e1d; font-weight: 800; font-size: 18px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 4px 12px color-mix(in srgb, var(--accent) 45%, transparent);
  transition: background 1s var(--smooth);
}

.tabs { position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 999px; justify-self: center; }
.tab {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 8px;
  padding: 11px 17px; border-radius: 999px;
  color: var(--fg); text-decoration: none; font-weight: 600; font-size: 15px; line-height: 1; letter-spacing: -.01em;
  transition: color .35s ease, transform .4s var(--spring);
}
.tab:hover { transform: scale(1.04); }
.tab:active { transform: scale(.94); }
.tab svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tab { background-color: transparent; transition: background-color .15s ease, color .2s ease, box-shadow .15s ease, transform .4s var(--spring); }
.tab:not([aria-current="page"]):hover { color: color-mix(in srgb, var(--c) 55%, var(--fg)); }
/* the solid neon pill fills in once the liquid drop arrives (.5s delay) */
.tab[aria-current="page"] {
  background-color: var(--c); color: #0b0e1d;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 4px 16px color-mix(in srgb, var(--c) 55%, transparent), 0 2px 0 color-mix(in srgb, var(--c) 60%, #0b0e1d);
  transition: background-color .35s ease .5s, color .35s ease .5s, box-shadow .3s ease .5s, transform .4s var(--spring);
}
.dropwrap { position: absolute; inset: -24px; z-index: 0; pointer-events: none; filter: url(#goo); opacity: 0; }
.dropwrap i { position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 999px; }
.dropwrap .d-from { background: var(--c0, #1ea7ff); }
.dropwrap .d-head { background: var(--c1, #1ea7ff); }
.dropwrap .d-bridge { border-radius: 0; transform-origin: 0 50%; background: linear-gradient(90deg, var(--c0, #1ea7ff), var(--c1, #1ea7ff)); }

.acct { position: relative; justify-self: end; }
.round-btn {
  width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  color: var(--fg); transition: transform .4s var(--spring);
}
.round-btn:hover { transform: scale(1.07); }
.round-btn:active { transform: scale(.92); }
.round-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.round-btn .hl { transform-box: fill-box; transform-origin: center; transition: transform .35s var(--spring), opacity .2s ease; }
.acct.open .hl:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.acct.open .hl:nth-child(2) { opacity: 0; }
.acct.open .hl:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }
.menu {
  position: absolute; right: 0; top: calc(100% + 10px); width: 258px; padding: 8px; border-radius: 26px;
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(-8px) scale(.92); transform-origin: top right;
  transition: opacity .2s ease, transform .45s var(--spring), visibility .2s;
}
.acct.open .menu { opacity: 1; visibility: visible; pointer-events: auto; transform: none; }
.menu-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: linear-gradient(160deg, var(--pink), var(--orange)); }
.menu-head b { display: block; font-size: 16px; letter-spacing: -.01em; }
.menu-head small { color: var(--fg2); font-size: 13px; }
.menu-item {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 12px; border: 0; border-radius: 16px; background: transparent; cursor: pointer; text-align: left;
  font-size: 16px; font-weight: 500; transition: background .2s ease;
}
.menu-item:hover { background: var(--fill); }
.menu-item svg { width: 20px; height: 20px; fill: none; stroke: var(--fg2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.menu hr { border: 0; height: .5px; background: var(--sep); margin: 6px 12px; }
/* ---------- Theme switch (sun / moon) ---------- */
.switch {
  position: relative; width: 44px; height: 22px; padding: 0; flex: none; overflow: hidden; cursor: pointer; background: transparent;
  border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); border-radius: 999px;
  box-shadow: 0 6px 16px -6px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .3s cubic-bezier(.3, 1.6, .5, 1);
}
.switch:hover { transform: scale(1.06); }
.switch:active { transform: scale(.95); }
.switch .track { position: absolute; inset: 0; }
.switch .t-day { background: linear-gradient(180deg, #6fc3ff, #c4e9ff); }
.switch .t-night { background: linear-gradient(180deg, #131d4d, #060a22); opacity: var(--night); transition: opacity .8s ease; }
.switch .ic { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; }
.switch .stars, .switch .clouds { position: absolute; inset: 0; transition: opacity .7s ease, transform .8s cubic-bezier(.3, 1.3, .5, 1); }
.switch .stars { opacity: var(--night); transform: translateY(calc((1 - var(--night)) * -10px)); }
.switch .stars i { position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px #fff; animation: twinkle 2.6s ease-in-out infinite alternate; }
.switch .stars i:nth-child(1) { left: 6px; top: 4px; }
.switch .stars i:nth-child(2) { left: 12px; top: 12px; width: 1.2px; height: 1.2px; animation-delay: -.8s; }
.switch .stars i:nth-child(3) { left: 4px; top: 13px; width: 1.2px; height: 1.2px; animation-delay: -1.5s; }
.switch .stars i:nth-child(4) { left: 17px; top: 5px; width: 1.2px; height: 1.2px; animation-delay: -2s; }
.switch .stars i:nth-child(5) { left: 10px; top: 7px; width: 1.2px; height: 1.2px; animation-delay: -1.1s; }
.switch .clouds { opacity: calc(1 - var(--night)); transform: translateY(calc(var(--night) * 12px)); }
.switch .clouds i { position: absolute; border-radius: 999px; background: #fff; }
.switch .clouds i:nth-child(1) { right: 4px; bottom: 2px; width: 16px; height: 6px; }
.switch .clouds i:nth-child(2) { right: 12px; bottom: 6px; width: 9px; height: 5px; }
@keyframes twinkle { from { opacity: .35; scale: .8; } to { opacity: 1; scale: 1.25; } }
.switch .knob {
  position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .35); transform: translateX(calc(var(--night) * 22px));
  transition: transform .4s cubic-bezier(.3, 1.4, .5, 1);
}
.switch .knob .ic { left: 50%; right: auto; margin: -5px 0 0 -5px; color: #1b1f33; opacity: 1; transition: opacity .3s ease; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.switch .knob .ic.s { opacity: calc(1 - var(--night)); color: #f59e0b; }
.switch .knob .ic.m { opacity: var(--night); color: #3b4380; }
.theming, .theming *, .theming *::before, .theming *::after { transition-property: background-color, color, border-color, box-shadow !important; transition-duration: .8s !important; transition-timing-function: ease !important; }

/* ---------- Page ---------- */
main { width: min(1080px, 100%); margin: 0 auto; padding: 22px max(20px, env(safe-area-inset-right, 0px)) 150px max(20px, env(safe-area-inset-left, 0px)); }
.large { display: grid; gap: 12px; margin-bottom: 30px; max-width: 760px; }
.eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); }
.eyebrow::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
h1 { margin: 0; font-size: clamp(36px, 6.4vw, 60px); line-height: 1.03; font-weight: 800; letter-spacing: -.035em; text-wrap: balance; }
.large p { margin: 0; max-width: 52ch; font-size: 19px; line-height: 1.45; color: var(--fg2); letter-spacing: -.01em; }
.large.swap .t { animation: rise .6s var(--smooth) both; }
.large.swap .t:nth-child(2) { animation-delay: .04s; }
.large.swap .t:nth-child(3) { animation-delay: .08s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.dash > * { min-width: 0; }
.s12 { grid-column: span 12; } .s7 { grid-column: span 7; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
@media (max-width: 860px) { .s7, .s5, .s6 { grid-column: span 12; } }
.panel:not(.quiet) .dash > * { animation: pop .6s var(--smooth) both; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } }
/* page-to-page: old content fades out softly before the new one fades in */
.panel, .large { transition: opacity .22s ease; }
.panel.is-out, .large.is-out { opacity: 0; }

.sec { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 4px 0; font-size: 24px; font-weight: 700; letter-spacing: -.025em; }
.sec small { font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: -.01em; }

.card { position: relative; padding: 24px; border-radius: 30px; background: var(--card); box-shadow: var(--card-shadow); overflow: hidden; }
.card h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 14px; font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
.hint { font-size: 14px; font-weight: 500; color: var(--fg2); letter-spacing: -.005em; }
.kicker { margin-bottom: 8px; font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg2); }
.sub { margin: 4px 0 0; color: var(--fg2); font-size: 15px; line-height: 1.4; }
.q { margin: 0 0 12px; font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
@supports (corner-shape: squircle) { .card, .tile, .app-icon, .thumb, .group { corner-shape: squircle; } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 600; line-height: 1; white-space: nowrap;
  color: color-mix(in srgb, var(--c, var(--accent)) 80%, var(--fg));
  background: color-mix(in srgb, var(--c, var(--accent)) 15%, transparent);
}
.bar-track { height: 9px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.bar-track > i { display: block; height: 100%; width: var(--w, 0%); border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--accent)) 75%, #fff), var(--c, var(--accent))); animation: grow 1.1s var(--smooth) .25s both; }
@keyframes grow { from { width: 0; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 22px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--c, var(--accent)); color: #fff; font-size: 16px; font-weight: 600; letter-spacing: -.01em; text-decoration: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 6px 16px color-mix(in srgb, var(--c, var(--accent)) 40%, transparent);
  transition: transform .4s var(--spring), filter .2s ease;
}
.btn:hover { filter: brightness(1.07); transform: scale(1.04); }
.btn:active { transform: scale(.94); }
.btn.soft { background: color-mix(in srgb, var(--c, var(--accent)) 15%, transparent); color: var(--c, var(--accent)); box-shadow: none; padding: 9px 18px; font-size: 15px; font-weight: 700; }
.btn.white { background: #fff; color: var(--c, var(--blue)); box-shadow: 0 8px 20px rgba(0, 0, 0, .18); }
.card > .btn, .info > .btn { margin-top: 16px; }

/* app-icon tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 960px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .tiles { gap: 12px; } }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; min-height: 190px; padding: 20px; border: 0; border-radius: 30px;
  background: var(--card); box-shadow: var(--card-shadow); text-align: left; cursor: pointer; overflow: hidden;
  transition: transform .55s var(--spring), box-shadow .3s ease;
}
.tile::after { content: ""; position: absolute; right: -50px; top: -50px; width: 140px; height: 140px; border-radius: 50%; background: var(--c); opacity: .1; filter: blur(8px); transition: opacity .4s ease, transform .6s var(--smooth); }
.tile:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 20px 44px color-mix(in srgb, var(--c) 22%, transparent), var(--card-shadow); }
.tile:hover::after { opacity: .22; transform: scale(1.4); }
.tile:active { transform: scale(.96); }
.app-icon {
  width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; font-size: 29px; margin-bottom: 18px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 65%, #fff), var(--c));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 8px 18px color-mix(in srgb, var(--c) 38%, transparent);
}
.tile b { font-size: 19px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.tile small { margin-top: 5px; color: var(--fg2); font-size: 14px; line-height: 1.35; }
.tile .metas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 16px; }
.mini { padding: 5px 9px; border-radius: 99px; background: color-mix(in srgb, var(--c) 14%, transparent); color: color-mix(in srgb, var(--c) 78%, var(--fg)); font-size: 11.5px; font-weight: 700; }

/* hero gradient card */
.hero {
  display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; padding: 30px; color: #fff;
  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--purple) 70%, transparent), transparent 55%), linear-gradient(135deg, color-mix(in srgb, var(--blue) 88%, #fff), var(--indigo));
  box-shadow: 0 24px 54px color-mix(in srgb, var(--blue) 38%, transparent), inset 0 1px 0 rgba(255, 255, 255, .4);
}
.hero::after { content: ""; position: absolute; right: -80px; bottom: -120px; width: 320px; height: 320px; border-radius: 50%; background: rgba(255, 255, 255, .14); filter: blur(10px); pointer-events: none; }
.hero .kicker { color: rgba(255, 255, 255, .78); }
.hero-title { margin: 2px 0 6px; font-size: clamp(30px, 4.6vw, 46px); font-weight: 800; letter-spacing: -.035em; line-height: 1.04; }
.hero .sub { color: rgba(255, 255, 255, .82); font-size: 17px; margin-bottom: 18px; }
.hero .bar-track { background: rgba(255, 255, 255, .28); max-width: 420px; }
.hero .bar-track > i { background: #fff; }
.hero .chip { background: rgba(255, 255, 255, .2); color: #fff; }
@media (max-width: 700px) { .hero { grid-template-columns: 1fr; padding: 24px; } .hero .btn { justify-self: start; } }

.uzio-pick { display: flex; gap: 18px; align-items: center; }
.uzio-mini {

.uzio-mini::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .8), transparent 45%), rgba(255, 255, 255, .22); }
.uzio-mini span { position: relative; text-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
.uzio-pick b { display: block; font-size: 21px; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 3px; }

/* grouped list (inset grouped, like Settings) */
.group { border-radius: 26px; background: var(--card); box-shadow: var(--card-shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; position: relative; }
.row + .row::before { content: ""; position: absolute; left: 82px; right: 0; top: 0; height: .5px; background: var(--sep); }
.row .app-icon { width: 46px; height: 46px; margin: 0; border-radius: 14px; font-size: 23px; }
.row .info { flex: 1; min-width: 0; }
.row .info b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.015em; }
.row .info small { display: block; color: var(--fg2); font-size: 14px; line-height: 1.35; }
.check { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 800; color: #fff; background: var(--green); box-shadow: 0 4px 10px color-mix(in srgb, var(--green) 40%, transparent); }
.check.todo { background: transparent; box-shadow: inset 0 0 0 2.5px var(--fill2); color: transparent; }

.suggest { display: flex; flex-direction: column; gap: 9px; }
.suggest button {
  padding: 12px 16px; border: 0; border-radius: 18px; text-align: left; cursor: pointer; background: var(--fill); font-size: 15px; font-weight: 500; color: var(--fg);
  transition: transform .4s var(--spring), background .2s ease;
}
.suggest button:hover { background: color-mix(in srgb, var(--accent) 14%, var(--fill)); transform: translateX(4px); }
.suggest button:active { transform: scale(.97); }

.quote { display: flex; align-items: center; justify-content: space-between; gap: 22px; flex-wrap: wrap; background: linear-gradient(135deg, color-mix(in srgb, var(--purple) 14%, var(--card)), var(--card)); }
.quote blockquote { margin: 6px 0 4px; font-size: clamp(28px, 4.4vw, 42px); font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }

/* video cards */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px 18px; }
.thumb {
  position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; padding: 0; border: 0; border-radius: 26px; overflow: hidden; cursor: pointer;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 60%, #000));
  box-shadow: 0 14px 30px color-mix(in srgb, var(--c) 30%, transparent), inset 0 1px 0 rgba(255, 255, 255, .45);
  transition: transform .55s var(--spring);
}
.thumb::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 25% 10%, rgba(255, 255, 255, .4), transparent 55%); }
.thumb:hover { transform: scale(1.03); }
.thumb:active { transform: scale(.97); }
.thumb .emo { position: absolute; right: 18px; top: 8px; font-size: 76px; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .25)); transition: transform .6s var(--spring); }
.thumb:hover .emo { transform: scale(1.12) rotate(-6deg); }
.thumb .play { position: absolute; left: 14px; bottom: 14px; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; padding-left: 3px; color: #fff; font-size: 16px; background: rgba(255, 255, 255, .26); -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .6), inset 0 1px 0 rgba(255, 255, 255, .7); }
.thumb .new { position: absolute; left: 14px; top: 14px; padding: 5px 10px; border-radius: 99px; background: #fff; color: #000; font-size: 11px; font-weight: 800; letter-spacing: .06em; }
.vmeta { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; padding: 0 4px; }
.vmeta h3 { margin: 0 0 2px; font-size: 17px; font-weight: 600; letter-spacing: -.015em; line-height: 1.25; }
.star { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fill); font-size: 19px; line-height: 1; cursor: pointer; transition: transform .4s var(--spring); }
.star:hover { transform: scale(1.12); } .star:active { transform: scale(.88); }
.star.on { color: var(--orange); background: color-mix(in srgb, var(--orange) 18%, transparent); }

/* quest */
.lvl { display: flex; align-items: center; gap: 22px; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 14; stroke-linecap: round; }
.ring .tr { stroke: var(--fill); }
.ring .pr { transition: stroke-dashoffset 1.4s var(--smooth) .3s; }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring b { font-size: 42px; font-weight: 800; line-height: 1; letter-spacing: -.04em; }
.ring span { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: .16em; color: var(--fg2); }
.big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; margin: 16px 0 14px; }
.day { display: grid; gap: 8px; justify-items: center; font-size: 12px; font-weight: 600; color: var(--fg2); }
.day i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 19px; background: var(--fill); }
.day.done i { background: linear-gradient(160deg, var(--orange), var(--pink)); box-shadow: 0 6px 14px color-mix(in srgb, var(--pink) 35%, transparent); }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

/* ---------- Uzio orb (WebGL) ---------- */
.uzio-orb { position: fixed; z-index: 80; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: block; color: var(--fg); text-decoration: none; outline: none; cursor: pointer; }
.orb-body { position: relative; display: block; width: 128px; height: 128px; animation: orbfloat 4.2s ease-in-out infinite; filter: drop-shadow(0 10px 14px var(--orb-shadow)); }
.uzio-orb canvas { display: block; width: 100%; height: 100%; }
.orb-fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.hat { position: absolute; inset: 0; opacity: 0; transform-origin: 50% 28%; will-change: transform, opacity; }
.hat svg { display: block; width: 100%; height: 100%; overflow: visible; }
.hat .prop { transform-box: fill-box; transform-origin: center; animation: propspin .38s linear infinite; }
@keyframes propspin { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
.orb-label {
  position: absolute; z-index: 2; right: calc(100% - 42px); bottom: calc(100% - 36px);
  padding: 12px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; white-space: nowrap; color: var(--fg);
  opacity: 0; pointer-events: none; transform: translate(16px, 12px) scale(.8); transform-origin: right bottom;
  transition: opacity .25s ease, transform .55s var(--spring);
}
.uzio-orb:hover .orb-label, .uzio-orb:focus-visible .orb-label { opacity: 1; transform: translate(0, 0) scale(1); }
.uzio-orb.no-gl canvas { background: conic-gradient(from 0deg, #1ea7ff, #ff2d75, #b8ff1f, #b44dff, #ffa11a, #1ea7ff); clip-path: circle(37%); }
@keyframes orbfloat { 50% { transform: translateY(-5px); } }

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 200; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px);
  padding: 14px 22px; border-radius: 999px; background: rgba(20, 20, 24, .88); color: #fff; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .22), 0 18px 40px rgba(0, 0, 0, .35);
  opacity: 0; transform: translate(-50%, 24px) scale(.9); pointer-events: none;
  transition: opacity .25s ease, transform .55s var(--spring);
}
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* ---------- Mobile: iOS tab bar at the bottom ---------- */
@media (max-width: 760px) {
  .bar { grid-template-columns: 1fr auto; padding-bottom: 10px; }
  .tabs {
    position: fixed; z-index: 70; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);

  .orb-label { display: none; }

  .lvl { flex-direction: column; align-items: flex-start; }
  .row .btn { padding: 8px 14px; }
  .row + .row::before { left: 78px; }
}

}

<script>
(function () {
  var root = document.documentElement;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Toast ---------- */

    b.addEventListener('click', function () { setMenu(false); toast(b.getAttribute('data-menu') + ' · coming soon'); });

  /* ---------- Theme ---------- */
  var toggle = $('themeToggle');

      var x = r.left + r.width / 2, y = r.top + r.height / 2;

      var vt = document.startViewTransition(apply);
      vt.ready.then(function () {
        root.animate(
          { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },

        );
      }).catch(function () {});
    } else {
      root.classList.add('theming');
      apply();
      setTimeout(function () { root.classList.remove('theming'); }, 900);
    }
  });

  /* ---------- Tabs: a liquid drop carries the colour from one tab to the next ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var activeTab = tabs[0], prevTab = null, cur = null, curColor = null, anims = [], ringTimer = 0;
  var dw = document.querySelector('.dropwrap');
  var dFrom = dw.querySelector('.d-from');
  var dHead = dw.querySelector('.d-head');
  var dBridge = dw.querySelector('.d-bridge');
  var OFF = 24;

  function geom(p) { return { l: p.offsetLeft, t: p.offsetTop, w: p.offsetWidth, h: p.offsetHeight }; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rect(cx, cy, w, h, col, off) {
    var o = { left: (cx - w / 2) + 'px', top: (cy - h / 2) + 'px', width: w + 'px', height: h + 'px' };

    anims.forEach(function (a) { a.cancel(); });
    anims = [];

  /* The drop pulls away from the old tab, stretches a neck, and lands in the new one, shifting colour on the way. */
  function runDrop(f, g, c0, c1) {
    var D = 950;
    var fx = f.l + f.w / 2 + OFF, fy = f.t + f.h / 2 + OFF;

    var dx = gx - fx, dy = gy - fy;
    var dist = Math.max(1, Math.hypot(dx, dy));
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var bh = g.h * 0.7;
    dw.style.setProperty('--c0', c0);
    dw.style.setProperty('--c1', c1);

    dBridge.style.left = fx + 'px';
    dBridge.style.top = (fy - bh / 2) + 'px';
    dBridge.style.width = dist + 'px';
    dBridge.style.height = bh + 'px';

    anims.push(dw.animate(
      [{ opacity: 0 }, { opacity: 0.92, offset: 0.06 }, { opacity: 0.92, offset: 0.78 }, { opacity: 0 }],
      { duration: D }

      rect(fx, fy, f.w, f.h, c0),
      rect(lerp(fx, gx, 0.1), lerp(fy, gy, 0.1), f.h * 1.1, f.h * 0.85, c0, 0.45),
      rect(lerp(fx, gx, 0.26), lerp(fy, gy, 0.26), 4, 4, c0)
    ], { duration: D, easing: 'ease-in-out' }));
    anims.push(dBridge.animate([
      { transform: rot + 'scale(0,1)' },
      { transform: rot + 'scale(0.75,1)', offset: 0.3 },
      { transform: rot + 'scale(1,0.6)', offset: 0.65 },
      { transform: rot + 'scale(1,0)' }
    ], { duration: D, easing: 'ease-in-out' }));

    var loc = gl.getAttribLocation(pr, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var U = {};
    ['uRes', 'uTime', 'uGaze', 'uBlink', 'uHappy', 'uSpin', 'uDark'].forEach(function (n) { U[n] = gl.getUniformLocation(pr, n); });
    gl.clearColor(0, 0, 0, 0);

    function fit() {
      var d = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.round(cv.clientWidth * d);
      if (w && cv.width !== w) { cv.width = w; cv.height = w; }
      gl.viewport(0, 0, cv.width, cv.height);
    }
    window.addEventListener('resize', fit);
    fit();

    /* cursor tracking: the face turns toward the pointer anywhere on the page */
    var px = null, py = null, lastMove = 0, hov = 0, hovT = 0, press = 0;
    window.addEventListener('pointermove', function (e) { px = e.clientX; py = e.clientY; lastMove = performance.now(); }, { passive: true });
    window.addEventListener('pointerdown', function (e) { px = e.clientX; py = e.clientY; lastMove = performance.now(); }, { passive: true });
    link.addEventListener('pointerenter', function () {
      hovT = 1;
      /* someone showed up: a hat politely pops off instead of staying on */
      if (mv && mv.n === 'hat' && (performance.now() - mv.t0) / MOVES.hat.d < .86) mv.t0 = performance.now() - MOVES.hat.d * .88;
    });
    link.addEventListener('pointerleave', function () { hovT = 0; });
    link.addEventListener('focus', function () { hovT = 1; });
    link.addEventListener('blur', function () { hovT = 0; });
    link.addEventListener('click', function () { press = 1; }); /* happy burst, then the link opens Uzio's Room */

    var body = document.getElementById('orbBody');
    var hatEl = document.getElementById('orbHat');
    var hatOn = false;

    /* Funny hats, drawn in a 128-unit box: the sphere's top sits near y=17, centred on x=64 */
    var HATS = {
      party: `<svg viewBox="0 0 128 128"><g transform="rotate(-11 64 28)"><path d="M43 29 L64 -6 L85 29 Z" fill="#ff2d55"/><polygon points="51.4,15 76.6,15 80.8,22 47.2,22" fill="#ffd60a"/><circle cx="61" cy="5" r="2" fill="#fff"/><circle cx="67" cy="9" r="1.7" fill="#fff"/><ellipse cx="64" cy="29" rx="22" ry="4.5" fill="#ff9f0a"/><circle cx="64" cy="-6" r="6" fill="#ffd60a"/></g></svg>`,
      wizard: `<svg viewBox="0 0 128 128"><g transform="rotate(8 64 28)"><path d="M41 30 L61 -16 Q67 -20 70 -8 L87 30 Z" fill="#5e5ce6"/><ellipse cx="64" cy="30" rx="27" ry="5.5" fill="#4442c4"/><circle cx="58" cy="12" r="2.4" fill="#ffd60a"/><circle cx="69" cy="18" r="1.9" fill="#ffd60a"/><circle cx="63" cy="0" r="1.6" fill="#fff"/></g></svg>`,
      crown: `<svg viewBox="0 0 128 128"><g transform="rotate(-6 64 28)"><path d="M43 29 L44 5 L55 16 L64 0 L73 16 L84 5 L85 29 Z" fill="#ffcc00" stroke="#e29a00" stroke-width="1.5" stroke-linejoin="round"/><rect x="43" y="23" width="42" height="6.5" rx="2" fill="#f0a000"/><circle cx="44" cy="5" r="2.8" fill="#ff375f"/><circle cx="64" cy="0" r="3" fill="#ff375f"/><circle cx="84" cy="5" r="2.8" fill="#ff375f"/><circle cx="53" cy="26.2" r="2.2" fill="#0a84ff"/><circle cx="64" cy="26.2" r="2.2" fill="#30d158"/><circle cx="75" cy="26.2" r="2.2" fill="#bf5af2"/></g></svg>`,
      propeller: `<svg viewBox="0 0 128 128"><g transform="rotate(7 64 28)"><path d="M42 30 Q42 9 64 9 Q86 9 86 30 Z" fill="#30b0c7"/><path d="M64 9 L64 30 M53 11 Q50 20 51 30 M75 11 Q78 20 77 30" stroke="#1e8aa0" stroke-width="1.4" fill="none"/><rect x="40" y="28" width="48" height="5.5" rx="2.7" fill="#ff375f"/><rect x="62.5" y="3" width="3" height="7" fill="#555"/><circle cx="64" cy="9" r="2.6" fill="#ffd60a"/><g class="prop"><ellipse cx="64" cy="3" rx="21" ry="3" fill="#ff9f0a"/></g></g></svg>`,
      chef: `<svg viewBox="0 0 128 128"><defs><g id="chefg"><circle cx="49" cy="15" r="10"/><circle cx="64" cy="9" r="12"/><circle cx="79" cy="15" r="10"/><rect x="47" y="15" width="34" height="14"/></g></defs><g transform="rotate(-5 64 28)"><use href="#chefg" fill="#fff" stroke="#cfcfd8" stroke-width="3.2" stroke-linejoin="round"/><use href="#chefg" fill="#fff"/><path d="M56 17 V27 M64 14 V27 M72 17 V27" stroke="#e3e3ea" stroke-width="1.4"/><rect x="45" y="27" width="38" height="6" rx="3" fill="#f2f2f7" stroke="#cfcfd8" stroke-width="1"/></g></svg>`
    };
    var HAT_NAMES = ['party', 'wizard', 'crown', 'propeller', 'chef'], lastHat = '';

    var dk = isDark() ? 1 : 0; /* 0 = light theme, 1 = dark theme; eases when the theme changes */
    var gx = 0, gy = 0, blinkAt = 1800, blinkStart = -1, last = performance.now(), T = reduce ? 3 : 0;
    var ease = function (x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
    var c01 = function (x) { return Math.max(0, Math.min(1, x)); };
    var PI = Math.PI, sin = Math.sin;

    /* Little moves. Each one tweaks the orb for progress ph (0..1) through the object o. */
    var MOVES = {
      spin:   { d: 1050, f: function (ph, o, m) { o.spin = m.dir * PI * 2 * ease(ph); o.jy = -15 * sin(PI * c01(ph * 1.05)); o.sy = 1 + .07 * sin(PI * ph); o.sx = 1 - .04 * sin(PI * ph); o.happy = .8 * sin(PI * ph); } },
      wiggle: { d: 900,  f: function (ph, o) { o.rot = 10 * sin(ph * PI * 6) * (1 - ph); o.happy = .55 * sin(PI * ph); } },
      yawn:   { d: 2300, f: function (ph, o) { var b = c01(sin(PI * ph) * 2.2); o.blink = 1 - .93 * b; o.happy = b; o.sy = 1 + .05 * b; o.sx = 1 - .03 * b; o.gyo = .25 * b; } },
      look:   { d: 2800, f: function (ph, o) { o.gx = sin(ph * PI * 2) * .95; o.gy = .25 * sin(ph * PI * 4) + .1; } },
      bounce: { d: 1200, f: function (ph, o) { var a = Math.abs(sin(ph * PI * 2)); o.jy = -13 * a; o.sy = 1 + .06 * a - .05 * (1 - a) * sin(PI * ph); o.sx = 1 - (o.sy - 1) * .6; o.happy = .6 * sin(PI * ph); } },
      /* giggle fit: eyes squeezed, mouth wide open, little shakes */
      laugh:  { d: 2400, f: function (ph, o) {
        var env = Math.min(1, ph * 8, (1 - ph) * 5), t = ph * PI * 2 * 5;
        o.happy = env; o.blink = 1 - .55 * env;
        o.jy = -5 * Math.abs(sin(t)) * env;
        o.rot = 5 * sin(ph * PI * 14) * env;
        o.sy = 1 + .05 * sin(t) * env; o.sx = 1 - (o.sy - 1) * .6;
      } },
      /* loses its balance: wobbles, looks up, rolls backwards, then rocks back to its feet */
      tipover: { d: 3400, f: function (ph, o) {
        var rot = 0, jx = 0, jy = 0, happy = 0, gy = 0;
        if (ph < .24) {
          var a = ph / .24;
          rot = 7 * sin(a * PI * 3) * a; happy = .15 * a; gy = .6 * a;
        } else if (ph < .52) {
          var b = (ph - .24) / .28, e = ease(b);
          rot = -62 * e; jx = -30 * e; jy = -6 * sin(PI * b);
          happy = .15 + .55 * c01(b * 4); gy = .6 + .3 * b;
        } else {
          var u = (ph - .52) / .48, dmp = Math.exp(-4.2 * u), cs2 = Math.cos(u * PI * 3.2);
          rot = -62 * dmp * cs2; jx = -30 * dmp * cs2;
          jy = -9 * Math.abs(sin(u * PI * 2.4)) * (1 - u);
          happy = c01(.7 + .2 * sin(u * PI * 6) - u * .6); gy = .9 * (1 - u);
          o.sy = 1 - .06 * Math.abs(sin(u * PI * 2.4)) * (1 - u); o.sx = 1 + (1 - o.sy) * .6;
        }
        o.rot = rot; o.jx = jx; o.jy += jy; o.happy = happy; o.gx = 0; o.gy = gy;
      } },
      /* a hat drops in, bounces on, gets a laugh and a wiggle, then pops off */
      hat:    { d: 6400, f: function (ph, o) {
        var h = { x: 0, y: 0, r: 0, a: 1 }, land = .1, out = .88;
        if (ph < land) {
          var p = ph / land;
          h.y = -90 * (1 - p * p); h.r = -30 * (1 - p); h.a = c01(p * 3);
          o.gx = 0; o.gy = .85;
        } else if (ph < land + .08) {
          var q = (ph - land) / .08;
          h.y = 5 * sin(q * PI); o.sy = 1 - .07 * sin(q * PI); o.sx = 1 + .04 * sin(q * PI); o.happy = .75 * q;
          o.gx = 0; o.gy = .85 * (1 - q * .6);
        } else if (ph < out) {
          var t = (ph - land - .08) / (out - land - .08);
          h.r = 4 * sin(t * PI * 6);
          o.rot = 3 * sin(t * PI * 5);
          o.happy = .6 + .3 * sin(t * PI * 4);
          if (t > .3 && t < .55) { /* giggle while wearing it */
            var g = sin((t - .3) / .25 * PI);
            o.happy = 1; o.blink = 1 - .5 * g; o.jy = -4 * Math.abs(sin(t * PI * 18)) * g;
            o.rot = 5 * sin(t * PI * 26) * g; h.r = 7 * sin(t * PI * 26) * g;
          } else o.jy = -2 * Math.abs(sin(t * PI * 3));
        } else {
          var w = (ph - out) / (1 - out);
          h.y = -110 * ease(w); h.r = 240 * w; h.a = 1 - c01((w - .5) * 2); o.happy = .6 * (1 - w);
        }
        o.hat = h;
      } },
      sleepy: { d: 3200, f: function (ph, o) { var s = sin(PI * ph); o.blink = 1 - .88 * s * s; o.gyo = -.45 * s; o.rot = 4 * sin(ph * PI * 2) * s; } }
    };
    var BORED = ['wiggle', 'yawn', 'look', 'bounce', 'sleepy', 'laugh', 'laugh', 'tipover', 'hat', 'hat', 'hat'];
    var mv = null, lastBored = '';
    var nextSpin = last + 10000 + Math.random() * 6000, nextBored = last + 5000;
    function start(name, now) {
      mv = { n: name, t0: now, dir: Math.random() < .5 ? 1 : -1 };
      if (name === 'hat') {
        var pool = HAT_NAMES.filter(function (n) { return n !== lastHat; });
        lastHat = pool[Math.floor(Math.random() * pool.length)];
        hatEl.innerHTML = HATS[lastHat];
      }
    }

    function frame(now) {
      requestAnimationFrame(frame);
      if (document.hidden) { last = now; return; }
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!reduce) T += dt;

      /* schedule: a spin every 10-18s, and when nobody has touched it for 6s it gets bored */
      if (!reduce && !mv && hov < .2 && press === 0) {
        if (now > nextSpin) { start('spin', now); nextSpin = now + 10000 + Math.random() * 8000; }
        else if (now - lastMove > 4000 && now > nextBored) {
          var pool = BORED.filter(function (n) { return n !== lastBored; });
          lastBored = pool[Math.floor(Math.random() * pool.length)];
          start(lastBored, now);
          nextBored = now + 3500 + Math.random() * 3500;
        }
      }
      var o = { spin: 0, jx: 0, jy: 0, sx: 1, sy: 1, rot: 0, happy: 0, blink: 1, gx: null, gy: null, gyo: 0, hat: null };
      if (mv) {
        var ph = (now - mv.t0) / MOVES[mv.n].d;
        if (ph >= 1) mv = null; else MOVES[mv.n].f(ph, o, mv);
      }

      var tx = 0, ty = 0;
      if (px !== null && now - lastMove < 5000) {
        var r = cv.getBoundingClientRect();
        var dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height / 2);
        var dist = Math.hypot(dx, dy) || 1, m = Math.min(1, dist / 240);
        tx = dx / dist * m; ty = -dy / dist * m;
      } else if (!reduce) { /* idle: look around lazily */
        tx = sin(T * .5) * .55; ty = sin(T * .37 + 1) * .3;
      }
      if (o.gx !== null) { tx = o.gx; ty = o.gy; }
      ty += o.gyo;
      var k = 1 - Math.exp(-dt * 9);
      gx += (tx - gx) * k; gy += (ty - gy) * k;
      hov += (hovT - hov) * (1 - Math.exp(-dt * 10));
      press = Math.max(0, press - dt * 2.2);
      var happy = Math.min(1, hov * .75 + press + o.happy);
      var blink = 1;
      if (!reduce) {
        if (blinkStart < 0 && now > blinkAt) blinkStart = now;
        if (blinkStart >= 0) {
          var bp = (now - blinkStart) / 170;
          if (bp >= 1) { blinkStart = -1; blinkAt = now + 1800 + Math.random() * 3200; }
          else blink = 1 - sin(PI * bp);
        }
      }
      blink = Math.min(blink, o.blink);
      if (o.hat) {
        var hk = body.clientWidth / 128;
        hatOn = true;
        hatEl.style.opacity = o.hat.a.toFixed(3);
        hatEl.style.transform = 'translate(' + (o.hat.x * hk).toFixed(2) + 'px,' + (o.hat.y * hk).toFixed(2) + 'px) rotate(' + o.hat.r.toFixed(2) + 'deg)';
      } else if (hatOn) { hatOn = false; hatEl.style.opacity = '0'; }
      var hs = 1 + .08 * hov;
      body.style.translate = o.jx.toFixed(2) + 'px ' + o.jy.toFixed(2) + 'px';
      body.style.scale = (o.sx * hs).toFixed(3) + ' ' + (o.sy * hs).toFixed(3);
      body.style.rotate = o.rot.toFixed(2) + 'deg';
      dk += ((isDark() ? 1 : 0) - dk) * (1 - Math.exp(-dt * 3.5));
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(U.uDark, dk);
      gl.uniform2f(U.uRes, cv.width, cv.height);
      gl.uniform1f(U.uTime, T);
      gl.uniform2f(U.uGaze, gx, gy);
      gl.uniform1f(U.uBlink, blink);
      gl.uniform1f(U.uHappy, happy);
      gl.uniform1f(U.uSpin, o.spin);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    requestAnimationFrame(frame);
  })();

  /* ---------- Scroll edge effect ---------- */
  var barEl = $('bar');
  function onScroll() { barEl.classList.toggle('scrolled', (window.scrollY || 0) > 24); }
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || 'home');
})();
</script>
</body>
</html>
