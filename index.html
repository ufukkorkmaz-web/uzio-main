<style>
@property --accent { syntax:'<color>'; inherits:true; initial-value:#1ea7ff; }
:root{

}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--card:#1c1c1e;--fg:#fff;--fg2:rgba(235,235,245,.64);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--sep:rgba(84,84,88,.6);--glass:rgba(58,58,62,.5);--glass-edge:rgba(255,255,255,.16);--spec:rgba(255,255,255,.28);--glass-shadow:0 12px 40px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);--night:1}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--fg:#fff;--fg2:rgba(235,235,245,.64);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--sep:rgba(84,84,88,.6);--glass:rgba(58,58,62,.5);--glass-edge:rgba(255,255,255,.16);--spec:rgba(255,255,255,.28);--glass-shadow:0 12px 40px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);--night:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px}
.wallpaper{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.wallpaper i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(82px);opacity:.33}
.wallpaper i:nth-child(1){left:-18vmax;top:-26vmax;background:radial-gradient(circle,var(--accent),transparent 66%);animation:d1 22s ease-in-out infinite alternate}
.wallpaper i:nth-child(2){right:-19vmax;top:2vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,var(--purple)),transparent 66%);animation:d2 27s ease-in-out infinite alternate}
.wallpaper i:nth-child(3){left:15vmax;bottom:-36vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 35%,var(--teal)),transparent 66%);animation:d3 25s ease-in-out infinite alternate}
@keyframes d1{to{translate:18vmax 12vmax;scale:1.16}}@keyframes d2{to{translate:-15vmax 8vmax;scale:.9}}@keyframes d3{to{translate:14vmax -10vmax;scale:1.14}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1.5px 0 var(--spec),inset 0 -1px 0 rgba(255,255,255,.08),var(--glass-shadow)}
.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:0 max(22px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
.topbar{position:relative;z-index:30;display:grid;grid-template-columns:1fr auto;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 0 12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:19px;font-weight:700;letter-spacing:-.02em;width:max-content}
.brand-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));color:#0b0e1d;font-weight:800;font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px color-mix(in srgb,var(--accent) 45%,transparent)}
.actions{display:flex;gap:10px;align-items:center}.round-btn{width:46px;height:46px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .4s var(--spring)}.round-btn:hover{filter:brightness(1.03)}.round-btn:active{transform:scale(.92)}.round-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.round-btn.lang-btn{font-size:12px;font-weight:800;letter-spacing:.04em}
.pop{position:relative}.menu{position:absolute;right:0;top:calc(100% + 10px);width:230px;padding:8px;border-radius:26px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px) scale(.92);transform-origin:top right;transition:opacity .2s ease,transform .45s var(--spring),visibility .2s}.pop.open .menu{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;border-radius:16px;background:transparent;cursor:pointer;text-align:left;font-size:15px;font-weight:600}.menu-item:hover{background:var(--fill)}.flag{width:26px;text-align:center;font-size:18px}.menu-item .check{margin-left:auto;color:var(--accent);opacity:0}.menu-item[aria-current="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}.menu-item[aria-current="true"] .check{opacity:1}.menu hr{border:0;height:.5px;background:var(--sep);margin:6px 12px}.theme-row{justify-content:space-between}.switch{width:44px;height:24px;border:1px solid color-mix(in srgb,var(--fg) 20%,transparent);border-radius:99px;background:linear-gradient(180deg,#74c9ff,#d6efff);position:relative;padding:0;cursor:pointer;overflow:hidden}.switch:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#15204f,#070b24);opacity:var(--night);transition:opacity .5s}.switch i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transform:translateX(calc(var(--night) * 20px));transition:transform .4s var(--spring)}
.hero{min-height:0;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(340px,.98fr);gap:clamp(18px,4vw,70px);align-items:center;width:min(1180px,100%);margin:0 auto;padding:clamp(12px,3vh,28px) 0 clamp(20px,4vh,46px)}
.copy{align-self:center;max-width:650px}.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2)}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 18%,transparent)}
h1{margin:18px 0 16px;font-size:clamp(46px,6.8vw,88px);line-height:.96;letter-spacing:-.055em;font-weight:800;text-wrap:balance}h1 .grad{background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:52ch;color:var(--fg2);font-size:clamp(17px,1.8vw,21px);line-height:1.48;letter-spacing:-.015em}.ctas{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 23px;border:0;border-radius:999px;text-decoration:none;cursor:pointer;font-size:16px;font-weight:700;letter-spacing:-.01em;transition:transform .4s var(--spring),filter .2s ease}.btn:hover{filter:brightness(1.04)}.btn:active{transform:scale(.95)}.primary{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px color-mix(in srgb,var(--accent) 38%,transparent)}.secondary{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 0 var(--spec),0 8px 24px rgba(30,30,60,.09)}.proof{display:flex;gap:14px;align-items:center;margin-top:22px;color:var(--fg2);font-size:13px;font-weight:600;flex-wrap:wrap}.proof span{display:flex;gap:6px;align-items:center}.dot{width:4px;height:4px;border-radius:50%;background:var(--fg2);opacity:.45}
.visual{position:relative;height:min(70vh,650px);min-height:420px;display:grid;place-items:center;isolation:isolate}.halo{position:absolute;width:min(42vw,510px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 25%,transparent) 0 34%,color-mix(in srgb,var(--purple) 12%,transparent) 48%,transparent 70%);filter:blur(10px);animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08);opacity:.82}}
.uzio-orb{position:relative;z-index:5;display:block;width:min(34vw,390px);aspect-ratio:1;color:var(--fg);text-decoration:none;outline:none;cursor:pointer}
.orb-body{position:relative;display:block;width:100%;height:100%;animation:orbfloat 4.2s ease-in-out infinite;filter:drop-shadow(0 24px 34px rgba(60,70,150,.24));transform-origin:center}
.uzio-orb canvas{display:block;width:100%;height:100%}.orb-fx{position:absolute;inset:0;pointer-events:none;overflow:visible}.hat{position:absolute;inset:0;opacity:0;transform-origin:50% 28%;will-change:transform,opacity}.hat svg{display:block;width:100%;height:100%;overflow:visible}.hat .prop{transform-box:fill-box;transform-origin:center;animation:propspin .38s linear infinite}@keyframes propspin{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.uzio-orb.no-gl canvas{background:conic-gradient(from 0deg,#1ea7ff,#ff2d75,#b8ff1f,#b44dff,#ffa11a,#1ea7ff);clip-path:circle(37%)}@keyframes orbfloat{50%{transform:translateY(-12px)}}
.bubble{position:absolute;padding:13px 17px;border-radius:20px;font-size:14px;font-weight:700;letter-spacing:-.01em;animation:bob 5s ease-in-out infinite}.bubble b{display:block;font-size:19px;line-height:1.05;margin-bottom:2px}.b1{left:1%;top:18%;animation-delay:-1s}.b2{right:0;top:24%;animation-delay:-2.4s}.b3{left:8%;bottom:15%;animation-delay:-3.2s}@keyframes bob{50%{transform:translateY(-8px) rotate(1deg)}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 18px var(--c);animation:tw 2.4s ease-in-out infinite alternate}.s1{--c:var(--pink);right:16%;bottom:12%}.s2{--c:var(--green);left:16%;top:9%;animation-delay:-1.1s}.s3{--c:var(--orange);right:11%;top:9%;animation-delay:-.5s}@keyframes tw{to{opacity:.25;transform:scale(.6)}}
@media(max-width:820px){.shell{padding-left:18px;padding-right:18px}.hero{grid-template-columns:1fr;gap:0;text-align:center;padding-top:4px;padding-bottom:14px}.copy{margin:auto;z-index:2}.eyebrow{font-size:11px}h1{font-size:clamp(42px,12vw,68px);margin:12px 0 12px}.lead{font-size:16px;max-width:38ch;margin:auto}.ctas,.proof{justify-content:center}.ctas{margin-top:20px}.visual{height:36vh;min-height:245px;margin-top:-8px}.uzio-orb{width:min(56vw,280px)}.halo{width:min(70vw,350px)}.bubble{padding:9px 12px;font-size:11px;border-radius:15px}.bubble b{font-size:15px}.b1{left:4%;top:10%}.b2{right:3%;top:16%}.b3{left:10%;bottom:7%}.proof{margin-top:14px;font-size:11.5px}}
@media(max-width:480px){.topbar{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:6px}.brand span:last-child{display:none}.round-btn{width:42px;height:42px}.hero{padding-top:0}.eyebrow{display:none}h1{font-size:clamp(40px,12.8vw,58px);margin-top:2px}.lead{font-size:14.5px;line-height:1.4}.ctas{margin-top:16px}.btn{padding:12px 18px;font-size:14px}.proof{display:none}.visual{height:38vh;min-height:220px}.uzio-orb{width:min(62vw,245px)}.b3{display:none}}
@media(max-height:720px) and (min-width:821px){h1{font-size:clamp(44px,6vw,68px);margin:12px 0}.lead{font-size:17px}.visual{height:64vh;min-height:360px}.uzio-orb{width:min(31vw,330px)}.ctas{margin-top:20px}.proof{margin-top:14px}}

/* ---------- Magnetic hover: landing page only ---------- */
@media (hover:hover) and (pointer:fine){
  .magnetic{will-change:transform;transform-style:preserve-3d;transition:transform .42s var(--spring),filter .2s ease,box-shadow .25s ease}
  .magnetic.is-magnetic{transition:transform .10s ease-out,filter .2s ease,box-shadow .25s ease}
  .btn.magnetic:hover{filter:brightness(1.04)}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<body>
<div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#" aria-label="Uzio English"><span class="brand-mark">U</span><span>Uzio</span></a>
    <div class="actions">
      <div class="pop" id="langPop">
        <button class="round-btn glass lang-btn" id="langBtn" type="button" aria-expanded="false" aria-controls="langMenu"><span id="langCode">EN</span></button>
        <div class="menu glass" id="langMenu" inert>
          <button class="menu-item" type="button" data-lang="en" aria-current="true"><span class="flag">🇬🇧</span><span>English</span><span class="check">✓</span></button>
          <button class="menu-item" type="button" data-lang="tr"><span class="flag">🇹🇷</span><span>Türkçe</span><span class="check">✓</span></button>
          <button class="menu-item" type="button" data-lang="fr"><span class="flag">🇫🇷</span><span>Français</span><span class="check">✓</span></button>
          <button class="menu-item" type="button" data-lang="de"><span class="flag">🇩🇪</span><span>Deutsch</span><span class="check">✓</span></button>
        </div>
      </div>
      <div class="pop" id="morePop">
        <button class="round-btn glass" id="moreBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="moreMenu"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
        <div class="menu glass" id="moreMenu" inert>
          <a class="menu-item" href="main.html" id="menuEnter">Enter Uzio</a>
          <button class="menu-item theme-row" type="button" id="themeToggle"><span id="themeLabel">Dark mode</span><span class="switch" aria-hidden="true"><i></i></span></button>
        </div>
      </div>
    </div>
  </header>

  <main class="hero">
    <section class="copy">
      <h1 id="headline">Meet <span class="grad">Uzio.</span><br>Your learning buddy.</h1>
      <p class="lead" id="lead">Play, practise, watch and speak your way to better English — with challenges that adapt to you.</p>
      <div class="ctas">
        <a class="btn primary" href="main.html" id="startBtn">Start learning <span aria-hidden="true">→</span></a>
        <a class="btn secondary" href="main.html#play" id="tryBtn">Try a quick game</a>
      </div>
      <div class="proof" aria-label="Highlights">
        <span id="proof1">⚡ Quick activities</span><span class="dot"></span><span id="proof2">🎯 Adaptive practice</span><span class="dot"></span><span id="proof3">💬 Real English</span>
      </div>
    </section>

    <section class="visual" aria-label="Uzio character">
      <div class="halo"></div>
      <div class="bubble glass b1"><b>Play</b><span id="bubble1">2–5 min</span></div>
      <div class="bubble glass b2"><b>Speak</b><span id="bubble2">Build confidence</span></div>
      <div class="bubble glass b3"><b>+35 XP</b><span id="bubble3">Keep your streak</span></div>
      <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
      <a class="uzio-orb" href="uzio_room.html" aria-label="Enter Uzio's Room">
        <span class="orb-body" id="orbBody">
          <canvas id="uzioOrb" width="512" height="512" aria-hidden="true"></canvas>
          <span class="orb-fx" aria-hidden="true"><span class="hat" id="orbHat"></span></span>
        </span>
      </a>
    </section>
  </main>
</div>
<script>
(function(){
  var root=document.documentElement;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Magnetic hover: buttons and floating UI lean toward the pointer ---------- */
  (function(){
    if(reduce || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;

    var els = [document.getElementById('startBtn'), document.getElementById('tryBtn')].filter(Boolean);
    els.forEach(function(el){ el.classList.add('magnetic'); });

    function strengthFor(el){
      if(el.classList.contains('bubble')) return {move:8, tilt:3.2};
      if(el.classList.contains('round-btn')) return {move:5, tilt:4};
      if(el.classList.contains('menu-item')) return {move:4, tilt:2.5};
      return {move:7, tilt:4.5};
    }

    els.forEach(function(el){
      el.addEventListener('pointermove', function(e){
        var r=el.getBoundingClientRect();
        var nx=((e.clientX-r.left)/r.width-.5)*2;
        var ny=((e.clientY-r.top)/r.height-.5)*2;
        var st=strengthFor(el);
        el.classList.add('is-magnetic');

        if(el.classList.contains('bubble')){
          el.style.translate=(nx*st.move).toFixed(2)+'px '+(ny*st.move).toFixed(2)+'px';
          el.style.rotate=(-nx*st.tilt).toFixed(2)+'deg';
        }else{
          var tx=(nx*st.move).toFixed(2);
          var ty=(ny*st.move).toFixed(2);
          var rx=(-ny*st.tilt).toFixed(2);
          var ry=(nx*st.tilt).toFixed(2);
          el.style.transform='perspective(650px) translate3d('+tx+'px,'+ty+'px,0) rotateX('+rx+'deg) rotateY('+ry+'deg) scale(1.018)';
        }
      });

      el.addEventListener('pointerleave', function(){
        el.classList.remove('is-magnetic');
        if(el.classList.contains('bubble')){
          el.style.translate='0 0';
          el.style.rotate='0deg';
        }else{
          el.style.transform='';
        }
      });
    });
  })();
  var langPop=document.getElementById('langPop'),morePop=document.getElementById('morePop');
  var langBtn=document.getElementById('langBtn'),moreBtn=document.getElementById('moreBtn');
  var langMenu=document.getElementById('langMenu'),moreMenu=document.getElementById('moreMenu');
  function setPop(pop,btn,menu,on){pop.classList.toggle('open',on);btn.setAttribute('aria-expanded',String(on));menu.inert=!on}
  langBtn.addEventListener('click',function(){var on=!langPop.classList.contains('open');setPop(morePop,moreBtn,moreMenu,false);setPop(langPop,langBtn,langMenu,on)});
  moreBtn.addEventListener('click',function(){var on=!morePop.classList.contains('open');setPop(langPop,langBtn,langMenu,false);setPop(morePop,moreBtn,moreMenu,on)});
  document.addEventListener('pointerdown',function(e){if(!langPop.contains(e.target))setPop(langPop,langBtn,langMenu,false);if(!morePop.contains(e.target))setPop(morePop,moreBtn,moreMenu,false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){setPop(langPop,langBtn,langMenu,false);setPop(morePop,moreBtn,moreMenu,false)}});

  var copy={
    en:{code:'EN',headline:'Meet <span class="grad">Uzio.</span><br>Your learning buddy.',lead:'Play, practise, watch and speak your way to better English — with challenges that adapt to you.',start:'Start learning',try:'Try a quick game',p1:'⚡ Quick activities',p2:'🎯 Adaptive practice',p3:'💬 Real English',b1:'2–5 min',b2:'Build confidence',b3:'Keep your streak',enter:'Enter Uzio',theme:'Dark mode'},
    tr:{code:'TR',headline:'<span class="grad">Uzio</span> ile tanış.<br>Sana ayak uyduran İngilizce.',lead:'Oyna, pratik yap, izle ve konuş. Sana uyum sağlayan görevlerle İngilizceni geliştir.',start:'Öğrenmeye başla',try:'Hızlı bir oyun dene',p1:'⚡ Kısa etkinlikler',p2:'🎯 Kişiye uyarlanan pratik',p3:'💬 Gerçek İngilizce',b1:'2–5 dk',b2:'Özgüvenini geliştir',b3:'Serini sürdür',enter:'Uzio’ya gir',theme:'Karanlık mod'},
    fr:{code:'FR',headline:'Découvre <span class="grad">Uzio.</span><br>Un anglais qui s’adapte à toi.',lead:'Joue, entraîne-toi, regarde et parle pour progresser en anglais avec des défis qui s’adaptent à toi.',start:'Commencer',try:'Essayer un jeu rapide',p1:'⚡ Activités rapides',p2:'🎯 Entraînement adaptatif',p3:'💬 Anglais authentique',b1:'2–5 min',b2:'Prends confiance',b3:'Garde ta série',enter:'Entrer dans Uzio',theme:'Mode sombre'},

          var bp = (now - blinkStart) / 170;
          if (bp >= 1) { blinkStart = -1; blinkAt = now + 1800 + Math.random() * 3200; }
          else blink = 1 - sin(PI * bp);
        }
      }
      var wink = 1;
      if (forcedWinkStart >= 0) {
        var fp = (now - forcedWinkStart) / 190;
        if (fp >= 1) forcedWinkStart = -1;
        else wink = 1 - sin(PI * fp);
      }
      blink = Math.min(blink, o.blink);
      if (o.hat) {
        var hk = body.clientWidth / 128;
        hatOn = true;
        hatEl.style.opacity = o.hat.a.toFixed(3);
        hatEl.style.transform = 'translate(' + (o.hat.x * hk).toFixed(2) + 'px,' + (o.hat.y * hk).toFixed(2) + 'px) rotate(' + o.hat.r.toFixed(2) + 'deg)';
      } else if (hatOn) { hatOn = false; hatEl.style.opacity = '0'; }
      var hs = 1 + .08 * hov;
      body.style.translate = o.jx.toFixed(2) + 'px ' + o.jy.toFixed(2) + 'px';
      body.style.scale = (o.sx * hs).toFixed(3) + ' ' + (o.sy * hs).toFixed(3);
      body.style.rotate = o.rot.toFixed(2) + 'deg';
      dk += ((isDark() ? 1 : 0) - dk) * (1 - Math.exp(-dt * 3.5));
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(U.uDark, dk);
      gl.uniform2f(U.uRes, cv.width, cv.height);
      gl.uniform1f(U.uTime, T);
      gl.uniform2f(U.uGaze, gx, gy);
      gl.uniform1f(U.uBlink, blink);
      gl.uniform1f(U.uWink, wink);
      gl.uniform1f(U.uHappy, happy);
      gl.uniform1f(U.uSpin, o.spin);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    requestAnimationFrame(frame);
  })();
})();
</script>
