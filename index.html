<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
<title>Classroom Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: nav pills centred along the top edge, theme switch pinned top right, one calm hero below that reacts to the active pill. */
@property --accent { syntax: '<color>'; inherits: true; initial-value: #1ea7ff; }
@property --hl { syntax: '<number>'; inherits: true; initial-value: 0; }

:root {
  --bg: #d8d3c5;
  --fg: #171a2c;
  --muted: #4a4e61;
  --ink-base: #0b0e1d;
  --rim: rgba(255, 255, 255, 0.75);
  --gloss: rgba(255, 255, 255, 0.7);
  --hl-a: 0.6;
  --goo-rest: 0.5;
  --night: 0;
  --switch-edge: rgba(23, 26, 44, 0.22);
  --switch-shadow: rgba(23, 26, 44, 0.28);
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D173B;
    --fg: #eef1ff;
    --muted: #a3accf;
    --ink-base: #ffffff;
    --rim: rgba(255, 255, 255, 0.32);
    --gloss: rgba(255, 255, 255, 0.34);
    --hl-a: 0.28;
    --goo-rest: 0.62;
    --night: 1;
    --switch-edge: rgba(255, 255, 255, 0.22);
    --switch-shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D173B;
  --fg: #eef1ff;
  --muted: #a3accf;
  --ink-base: #ffffff;
  --rim: rgba(255, 255, 255, 0.32);
  --gloss: rgba(255, 255, 255, 0.34);
  --hl-a: 0.28;
  --goo-rest: 0.62;
  --night: 1;
  --switch-edge: rgba(255, 255, 255, 0.22);
  --switch-shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

html, body { height: 100%; }
:root { transition: --accent 1.35s cubic-bezier(.22,.72,.24,1); }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: clip;
}

/* Fallback colour transition (used when View Transitions are unavailable) */
.theming, .theming *, .theming *::before, .theming *::after {
  transition-property: background-color, color, border-color, box-shadow !important;
  transition-duration: 0.8s !important;
  transition-timing-function: ease !important;
}
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-old(root) { z-index: 1; }
::view-transition-new(root) { z-index: 2; }

/* ---------- Top bar ---------- */
.top {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 14px 12px;
  padding-block: 18px 8px;
}
.top nav { position: relative; max-width: 100%; }
nav ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}


/* ---------- Mode control, bottom right ---------- */
.mode {
  position: fixed;
  z-index: 60;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
}

/* ---------- Theme switch ---------- */
.switch {
  position: relative;
  width: 60px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--switch-edge);
  border-radius: 999px;
  overflow: hidden;
  cursor: pointer;
  background: transparent;
  box-shadow: 0 6px 16px -6px var(--switch-shadow), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .3s cubic-bezier(.3,1.6,.5,1);
  -webkit-tap-highlight-color: transparent;
}
.switch:hover { transform: scale(1.06); }
.switch:active { transform: scale(.95); }
.switch:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.switch .track { position: absolute; inset: 0; }
.switch .day { background: linear-gradient(180deg, #6fc3ff, #c4e9ff); }
.switch .night { background: linear-gradient(180deg, #131d4d, #060a22); opacity: var(--night); transition: opacity .8s ease; }
.switch .ic { position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; }
.switch .stars, .switch .clouds { position: absolute; inset: 0; transition: opacity .7s ease, transform .8s cubic-bezier(.3,1.3,.5,1); }
.switch .stars { opacity: var(--night); transform: translateY(calc((1 - var(--night)) * -14px)); }
.switch .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px #fff; animation: twinkle 2.6s ease-in-out infinite alternate; }
.switch .stars i:nth-child(1) { left: 8px; top: 6px; }
.switch .stars i:nth-child(2) { left: 17px; top: 17px; width: 1.5px; height: 1.5px; animation-delay: -.8s; }
.switch .stars i:nth-child(3) { left: 6px; top: 18px; width: 1.5px; height: 1.5px; animation-delay: -1.5s; }
.switch .stars i:nth-child(4) { left: 23px; top: 8px; width: 1.5px; height: 1.5px; animation-delay: -2s; }
.switch .stars i:nth-child(5) { left: 14px; top: 10px; width: 1.5px; height: 1.5px; animation-delay: -1.1s; }
.switch .clouds { opacity: calc(1 - var(--night)); transform: translateY(calc(var(--night) * 16px)); }
.switch .clouds i { position: absolute; border-radius: 999px; background: #fff; }
.switch .clouds i:nth-child(1) { right: 5px; bottom: 3px; width: 22px; height: 8px; }
.switch .clouds i:nth-child(2) { right: 17px; bottom: 8px; width: 12px; height: 7px; }
@keyframes twinkle { from { opacity: .35; scale: .8; } to { opacity: 1; scale: 1.25; } }
.switch .knob {
  position: absolute;
  left: 2px;
  top: 2px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
  transform: translateX(calc(var(--night) * 30px));
  transition: transform .4s cubic-bezier(.3,1.4,.5,1);
}
.switch .knob .ic { left: 50%; right: auto; margin: -7px 0 0 -7px; color: #1b1f33; opacity: 1; transition: opacity .3s ease; }
.switch .knob .ic.s { opacity: calc(1 - var(--night)); color: #f59e0b; }
.switch .knob .ic.m { opacity: var(--night); color: #3b4380; }

/* ---------- Liquid glass pills ---------- */
.pill {
  position: relative;
  display: block;
  isolation: isolate;
  border-radius: 999px;
  color: inherit;
  text-decoration: none;
  outline: none;
  transition: transform .4s cubic-bezier(.3,1.6,.5,1);
  -webkit-tap-highlight-color: transparent;
}
.pill:hover { z-index: 3; transform: scale(1.02); }
.pill:active { transform: scale(.96); }

.face {
  position: relative;
  display: block;
  overflow: hidden;
  padding: 13px 22px;
  border-radius: 999px;
  font: 600 15px/1 var(--font-body);
  letter-spacing: .01em;
  white-space: nowrap;
  color: color-mix(in srgb, var(--c) 38%, var(--ink-base));
  background:
    radial-gradient(72px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,calc(var(--hl) * var(--hl-a) * .6)), transparent 70%),
    linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--c) 12%, transparent));
  -webkit-backdrop-filter: blur(8px) saturate(1.7);
  backdrop-filter: blur(8px) saturate(1.7);
  border: 1px solid color-mix(in srgb, var(--c) 58%, transparent);
  box-shadow:
    inset 0 1px 0 var(--rim),
    inset 0 -10px 16px color-mix(in srgb, var(--c) 24%, transparent),
    0 8px 20px -6px color-mix(in srgb, var(--c) 60%, transparent);
  transition: --hl .35s ease, box-shadow .4s ease;
}
.pill:hover .face { --hl: 1; }
.pill:focus-visible .face { outline: 2px solid var(--fg); outline-offset: 3px; }
.pill[aria-current="page"] .face {
  box-shadow:
    inset 0 1px 0 var(--rim),
    inset 0 -10px 16px color-mix(in srgb, var(--c) 38%, transparent),
    0 8px 20px -6px color-mix(in srgb, var(--c) 70%, transparent);
}
.face::before {
  content: "";
  position: absolute;
  left: 9%; right: 9%; top: 1px;
  height: 46%;
  border-radius: 999px;
  background: linear-gradient(var(--gloss), rgba(255,255,255,0));
  pointer-events: none;
}
.face::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 32%, rgba(255,255,255,.5) 50%, transparent 68%);
  transform: translateX(-130%);
  transition: transform .9s ease;
  pointer-events: none;
}
.pill:hover .face::after { transform: translateX(-130%); }
.label { position: relative; z-index: 1; }

/* ---------- Flat, chunky nav buttons (the Uzio brand pill keeps its glass look) ---------- */
.pill[data-view] .goo,
.pill[data-view] .face::before,
.pill[data-view] .face::after { display: none; }
.pill[data-view] .face {
  background: color-mix(in srgb, var(--c) 16%, transparent);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  border: 2px solid color-mix(in srgb, var(--c) 75%, transparent);
  color: color-mix(in srgb, var(--c) 25%, var(--ink-base));
  box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 55%, transparent);
  transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
}
.pill[data-view]:hover { transform: translateY(-2px); }
.pill[data-view]:hover .face { background-color: color-mix(in srgb, var(--c) 28%, transparent); }
/* Active tab: solid fill, which lands after the liquid drop arrives (.5s delay) */
.pill[data-view][aria-current="page"] .face {
  background-color: var(--c);
  border-color: var(--c);
  color: #0b0e1d;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 60%, #0b0e1d);
  transition: background-color .35s ease .5s, border-color .35s ease .5s, color .35s ease .5s, box-shadow .3s ease;
}
/* Press: the button sinks onto its shadow */
.pill[data-view]:active { transform: translateY(3px); }
.pill[data-view]:active .face,
.pill[data-view][aria-current="page"]:active .face { box-shadow: 0 0 0 transparent; }

/* Liquid layer: base pill + blobs, merged by the goo filter */
.goo {
  position: absolute;
  inset: -18px;
  z-index: -1;
  pointer-events: none;
  filter: blur(9px);
  opacity: calc(var(--goo-rest) * .45);
  transition: opacity .6s ease;
}
.pill:hover .goo { opacity: .55; }
.pill[aria-current="page"] .goo { opacity: .55; }
.goo i { position: absolute; border-radius: 50%; background: var(--c); }
.goo .b, .goo .follow { display: none; }
.goo .base { inset: 18px; border-radius: 999px; }
.goo .b {
  left: 50%; top: 50%;
  width: var(--s); height: var(--s);
  transform: translate(-50%, -50%) scale(.25);
  transition:
    left .6s cubic-bezier(.3,1.7,.5,1) var(--d),
    top .6s cubic-bezier(.3,1.7,.5,1) var(--d),
    transform .6s cubic-bezier(.3,1.7,.5,1) var(--d);
}
.pill:hover .goo .b {
  left: var(--x); top: var(--y);
  transform: translate(-50%, -50%) scale(1);
  animation: wob 2.4s ease-in-out var(--d) infinite alternate;
}
.goo .follow {
  left: 0; top: 0;
  width: 46px; height: 46px;
  margin: -23px 0 0 -23px;
  transform: translate(var(--fx, 60px), var(--fy, 37px)) scale(0);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
}
.pill:hover .goo .follow { transform: translate(var(--fx, 60px), var(--fy, 37px)) scale(1); }
@keyframes wob {
  0%   { translate: 0 0; scale: 1; }
  50%  { translate: 2px -3px; scale: 1.14; }
  100% { translate: -3px 2px; scale: .9; }
}

/* Click ripple, clipped inside the pill */
.ripple {
  position: absolute;
  left: var(--rx); top: var(--ry);
  width: var(--rs); height: var(--rs);
  margin: calc(var(--rs) / -2) 0 0 calc(var(--rs) / -2);
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.9) 0, color-mix(in srgb, var(--c) 72%, transparent) 34%, transparent 68%);
  transform: scale(0);
  opacity: .9;
  animation: ripple .8s cubic-bezier(.2,.7,.3,1) forwards;
}
.ripple.ring {
  background: none;
  border: 2px solid color-mix(in srgb, var(--c) 70%, #fff);
  animation-duration: 1s;
  animation-delay: .08s;
}
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* ---------- Uzio: all five neon colours as a slow liquid ---------- */
.pill.brand .face { font-weight: 600; letter-spacing: .05em; }
.brand .face::before, .brand .face::after { z-index: 1; }
.brand .label { display: inline-flex; align-items: center; gap: 8px; }

/* AI helper: floating button, bottom centre */
.ask {
  position: fixed;
  z-index: 80;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
}
/* At rest: just the sparkle + text, sitting in the bottom glow. No pill. */
.ask .pill.brand .face {
  background: transparent;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  border-color: transparent;
  box-shadow: none;
  color: var(--fg);
  text-shadow: none;
  transition: color .3s ease, border-color .4s ease, box-shadow .4s ease, text-shadow .3s ease;
}
.ask .goo { opacity: 0; }
.ask .liquid { opacity: 0; transform: scale(.3); transition: opacity .5s ease, transform .7s cubic-bezier(.3,1.5,.5,1); }
.ask .face::before { opacity: 0; transition: opacity .4s ease; }
/* On hover/focus: the rainbow liquid fills in and the pill takes shape */
.ask .pill.brand:is(:hover, :focus-visible) .face {
  border-color: rgba(255, 255, 255, .55);
  box-shadow: inset 0 1px 0 var(--rim), 0 10px 24px -8px rgba(23, 26, 44, .45);
  color: #fff;
  text-shadow: 0 1px 6px rgba(0, 0, 0, .45);
}
.ask .pill:is(:hover, :focus-visible) .liquid { opacity: .72; transform: scale(1); }
.ask .pill:is(:hover, :focus-visible) .face::before { opacity: 1; }
.ask .pill:is(:hover, :focus-visible) .goo { opacity: .55; }
.brand .goo .base {
  background: linear-gradient(90deg, #1ea7ff, #ff2d75, #b8ff1f, #b44dff, #ffa11a, #1ea7ff);
  background-size: 300% 100%;
  animation: liquidflow 40s ease-in-out infinite alternate;
}
.liquid {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(100deg, #1ea7ff, #ff2d75, #b8ff1f, #b44dff, #ffa11a, #1ea7ff);
  background-size: 300% 100%;
  opacity: .72;
  animation: liquidflow 40s ease-in-out infinite alternate;
}
.liquid i { position: absolute; width: 46px; height: 46px; border-radius: 50%; filter: blur(15px); opacity: .75; }
.liquid i:nth-child(1) { left: -8px; top: -14px; background: #ff2d75; animation: lq1 26s ease-in-out infinite alternate; }
.liquid i:nth-child(2) { right: -6px; bottom: -16px; background: #1ea7ff; animation: lq2 30s ease-in-out infinite alternate; }
.liquid i:nth-child(3) { left: 30%; top: -18px; background: #b8ff1f; animation: lq3 34s ease-in-out infinite alternate; }
.liquid i:nth-child(4) { left: 52%; bottom: -20px; background: #b44dff; animation: lq4 28s ease-in-out infinite alternate; }
.liquid i:nth-child(5) { left: 8px; bottom: -18px; background: #ffa11a; animation: lq5 32s ease-in-out infinite alternate; }
@keyframes liquidflow { to { background-position: 100% 0; } }
@keyframes lq1 { to { translate: 28px 10px; scale: 1.08; } }
@keyframes lq2 { to { translate: -28px -10px; scale: .95; } }
@keyframes lq3 { to { translate: -14px 12px; scale: 1.06; } }
@keyframes lq4 { to { translate: 16px -12px; scale: 1.08; } }
@keyframes lq5 { to { translate: 24px -10px; scale: .95; } }

/* ---------- Sliding highlight ---------- */
.slider {
  position: absolute;
  left: 0; top: 0;
  width: 0; height: 0;
  border-radius: 999px;
  pointer-events: none;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent) 6%, transparent));
  border: 1.5px solid color-mix(in srgb, var(--accent) 75%, transparent);
  -webkit-backdrop-filter: blur(6px) saturate(1.5);
  backdrop-filter: blur(6px) saturate(1.5);
  box-shadow: inset 0 1px 0 var(--rim), 0 0 26px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 4px color-mix(in srgb, var(--accent) 60%, transparent);
  transition: opacity .45s ease;
}
.slider { display: none; }

/* Liquid drop that carries the highlight from one pill to the next */
.dropwrap { position: absolute; inset: -24px; pointer-events: none; filter: url(#goo); opacity: 0; }
.dropwrap i { position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 999px; }
.dropwrap .d-from { background: var(--c0, #1ea7ff); }
.dropwrap .d-head { background: var(--c1, #1ea7ff); }
.dropwrap .d-bridge { border-radius: 0; transform-origin: 0 50%; background: linear-gradient(90deg, var(--c0, #1ea7ff), var(--c1, #1ea7ff)); }

/* ---------- Moving background ---------- */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i {
  position: absolute;
  width: 56vmax; height: 56vmax;
  border-radius: 50%;
  filter: blur(70px);
  opacity: calc(.34 + var(--night) * .16);
}
.aurora i:nth-child(1) { left: -14vmax; top: -20vmax; background: radial-gradient(circle, var(--accent), transparent 68%); animation: drift1 26s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { right: -16vmax; top: -10vmax; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 40%, #b44dff), transparent 68%); animation: drift2 31s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { left: -8vmax; bottom: -26vmax; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 50%, #1ea7ff), transparent 68%); animation: drift3 28s ease-in-out infinite alternate; }
.aurora i:nth-child(4) { right: -10vmax; bottom: -24vmax; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 45%, #ff2d75), transparent 68%); animation: drift4 35s ease-in-out infinite alternate; }
@keyframes drift1 { to { translate: 24vmax 18vmax; scale: 1.3; } }
@keyframes drift2 { to { translate: -26vmax 16vmax; scale: .85; } }
@keyframes drift3 { to { translate: 22vmax -14vmax; scale: 1.2; } }
@keyframes drift4 { to { translate: -20vmax -18vmax; scale: 1.35; } }

/* ---------- Uzio bottom glow ---------- */
.uzio-bottom-glow {
  position: fixed;
  left: 0; right: 0; bottom: -96px;
  height: 290px;
  z-index: 70;
  pointer-events: none;
  opacity: .86;
  transform: translateY(0) scaleX(1.01);
  transform-origin: 50% 100%;
  filter: blur(44px) saturate(1.40);
  background:
    radial-gradient(58% 128% at 8% 103%, rgba(255, 232, 188, .56) 0%, rgba(255, 213, 154, .30) 38%, transparent 74%),
    radial-gradient(54% 132% at 27% 103%, rgba(255, 133, 50, .64) 0%, rgba(255, 133, 50, .29) 42%, transparent 76%),
    radial-gradient(56% 132% at 44% 103%, rgba(250, 88, 133, .68) 0%, rgba(250, 88, 133, .30) 44%, transparent 77%),
    radial-gradient(56% 132% at 61% 103%, rgba(80, 116, 255, .68) 0%, rgba(80, 116, 255, .29) 44%, transparent 77%),
    radial-gradient(54% 130% at 79% 103%, rgba(69, 206, 244, .62) 0%, rgba(69, 206, 244, .28) 42%, transparent 76%),
    radial-gradient(58% 128% at 96% 103%, rgba(143, 88, 235, .64) 0%, rgba(143, 88, 235, .29) 40%, transparent 75%);
  mix-blend-mode: normal;
  transition: opacity .6s ease, transform .75s cubic-bezier(.2,.8,.2,1), filter .75s ease;
}
.uzio-bottom-glow::before {
  content: "";
  position: absolute;
  left: 3%; right: 3%; bottom: 4px;
  height: 92px;
  border-radius: 50%;
  background: linear-gradient(90deg,
    rgba(255,229,184,.52) 0%,
    rgba(255,147,61,.62) 18%,
    rgba(251,96,137,.64) 37%,
    rgba(83,122,255,.64) 58%,
    rgba(66,205,244,.58) 78%,
    rgba(143,88,235,.60) 100%);
  filter: blur(34px);
  opacity: .74;
}
.uzio-bottom-glow::after {
  content: "";
  position: absolute;
  left: 7%; right: 7%; bottom: 14px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(90deg,
    rgba(255,236,201,.86) 0%,
    rgba(255,139,49,.90) 18%,
    rgba(252,91,133,.92) 38%,
    rgba(77,114,255,.92) 59%,
    rgba(59,202,244,.88) 79%,
    rgba(137,83,235,.90) 100%);
  filter: blur(22px);
  opacity: .72;
  transition: opacity .8s ease;
}
.uzio-bottom-glow::before, .uzio-bottom-glow::after { opacity: .96; }
/* Screen-blend only works on dark backgrounds; on light it would wash out */

<script>
(function () {
  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Theme switch ---------- */
  var toggle = document.getElementById('themeToggle');
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function sync() { toggle.setAttribute('aria-checked', String(isDark())); }
  sync();

  toggle.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    var apply = function () { root.setAttribute('data-theme', next); sync(); };
    if (document.startViewTransition && !reduce) {
      var r = toggle.getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2;
      var end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      var vt = document.startViewTransition(apply);
      vt.ready.then(function () {
        root.animate(
          { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
          { duration: 900, easing: 'cubic-bezier(.65,0,.25,1)', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(function () {});
    } else {
      root.classList.add('theming');
      apply();
      setTimeout(function () { root.classList.remove('theming'); }, 900);
    }
  });

  /* ---------- Pills: liquid hover + inner ripple ---------- */
  var pills = document.querySelectorAll('.pill[data-view]');

  function track(p, e) {
    var f = p.querySelector('.face').getBoundingClientRect();
    var g = p.querySelector('.goo');
    var gr = g.getBoundingClientRect();
    p.style.setProperty('--mx', (e.clientX - f.left) + 'px');
    p.style.setProperty('--my', (e.clientY - f.top) + 'px');
    g.style.setProperty('--fx', (e.clientX - gr.left) + 'px');
    g.style.setProperty('--fy', (e.clientY - gr.top) + 'px');
  }

  function ripple(p, clientX, clientY, center) {
    var face = p.querySelector('.face');
    var r = face.getBoundingClientRect();
    var x = center ? r.width / 2 : clientX - r.left;
    var y = center ? r.height / 2 : clientY - r.top;
    var size = Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y)) * 2.2;
    ['', 'ring'].forEach(function (cls) {
      var s = document.createElement('span');
      s.className = 'ripple' + (cls ? ' ' + cls : '');
      s.style.setProperty('--rx', x + 'px');
      s.style.setProperty('--ry', y + 'px');
      s.style.setProperty('--rs', size + 'px');
      s.addEventListener('animationend', function () { s.remove(); });
      face.appendChild(s);
    });
  }

  document.querySelectorAll('.pill').forEach(function (p) {
    p.addEventListener('pointerenter', function (e) { track(p, e); });
    p.addEventListener('pointermove', function (e) { track(p, e); });
    p.addEventListener('pointerdown', function (e) { ripple(p, e.clientX, e.clientY, false); });
    p.addEventListener('click', function (e) {
      e.preventDefault();
      if (e.detail === 0) ripple(p, 0, 0, true); /* keyboard activation */
      if (p.classList.contains('brand')) return;
      var id = p.getAttribute('data-view');
      if (location.hash !== '#' + id) location.hash = id; else show(id);
    });
  });

  /* ---------- Sliding highlight ---------- */
  var slider = document.querySelector('.slider');
  var cur = null, activePill = null;
  function pillFor(id) {
    for (var i = 0; i < pills.length; i++) if (pills[i].getAttribute('data-view') === id) return pills[i];
    return pills[0];
  }
  function geom(p) { return { l: p.offsetLeft - 5, t: p.offsetTop - 5, w: p.offsetWidth + 10, h: p.offsetHeight + 10 }; }
  function box(g) { return { left: g.l + 'px', top: g.t + 'px', width: g.w + 'px', height: g.h + 'px' }; }
  var dw = document.querySelector('.dropwrap');
  var dFrom = dw.querySelector('.d-from');
  var dHead = dw.querySelector('.d-head');
  var dBridge = dw.querySelector('.d-bridge');
  var OFF = 24, anims = [], ringTimer = 0, curColor = null;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function rect(cx, cy, w, h, col, off) {
    var o = { left: (cx - w / 2) + 'px', top: (cy - h / 2) + 'px', width: w + 'px', height: h + 'px' };

    if (off != null) o.offset = off;
    return o;
  }
  function cancelDrop() {
    anims.forEach(function (a) { a.cancel(); });
    anims = [];
    clearTimeout(ringTimer);
    slider.classList.remove('moving');
  }

  /* A drop pulls away from the old pill, stretches a neck, and lands in the new one, shifting colour on the way. */
  function runDrop(f, g, c0, c1) {
    var D = 950;
    var fx = f.l + f.w / 2 + OFF, fy = f.t + f.h / 2 + OFF;
    var gx = g.l + g.w / 2 + OFF, gy = g.t + g.h / 2 + OFF;
    var dx = gx - fx, dy = gy - fy;
    var dist = Math.max(1, Math.hypot(dx, dy));
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var bh = g.h * 0.7;
    dw.style.setProperty('--c0', c0);
    dw.style.setProperty('--c1', c1);
    slider.classList.add('moving');

    dBridge.style.left = fx + 'px';
    dBridge.style.top = (fy - bh / 2) + 'px';
    dBridge.style.width = dist + 'px';
    dBridge.style.height = bh + 'px';
    var rot = 'rotate(' + ang + 'deg) ';

    anims.push(dw.animate(
      [{ opacity: 0 }, { opacity: 0.92, offset: 0.06 }, { opacity: 0.92, offset: 0.78 }, { opacity: 0 }],
      { duration: D }
    ));
    anims.push(dFrom.animate([
      rect(fx, fy, f.w, f.h, c0),
      rect(lerp(fx, gx, 0.1), lerp(fy, gy, 0.1), f.h * 1.1, f.h * 0.85, c0, 0.45),
      rect(lerp(fx, gx, 0.26), lerp(fy, gy, 0.26), 4, 4, c0)
    ], { duration: D, easing: 'ease-in-out' }));
    anims.push(dBridge.animate([
      { transform: rot + 'scale(0,1)' },
      { transform: rot + 'scale(0.75,1)', offset: 0.3 },
      { transform: rot + 'scale(1,0.6)', offset: 0.65 },
      { transform: rot + 'scale(1,0)' }
    ], { duration: D, easing: 'ease-in-out' }));
    anims.push(dHead.animate([
      rect(fx, fy, f.h * 0.8, f.h * 0.8, c0),
      rect(lerp(fx, gx, 0.72), lerp(fy, gy, 0.72), g.h * 1.5, g.h * 0.88, null, 0.55),
      rect(gx, gy, g.w, g.h, c1)
    ], { duration: D, easing: 'cubic-bezier(.5,.05,.25,1.12)' }));

    ringTimer = setTimeout(function () { slider.classList.remove('moving'); }, D * 0.72);
  }

  function moveSlider(p) {
    activePill = p;
    var g = geom(p);
    var col = p.style.getPropertyValue('--c').trim();
    cancelDrop();
    if (cur && curColor && !reduce && (cur.l !== g.l || cur.t !== g.t)) runDrop(cur, g, curColor, col);
    var b = box(g);

    slider.style.width = b.width; slider.style.height = b.height;

    curColor = col;
  }
  function resettle() { if (activePill) { cur = null; moveSlider(activePill); } }
  window.addEventListener('resize', resettle);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resettle);

  /* ---------- Uzio: size the glow so it gathers to about the pill's width ---------- */
  var askPill = document.querySelector('.ask .pill');
  function setGather() {
    if (!askPill) return;
    var s = Math.min(1, (askPill.offsetWidth * 1.6) / window.innerWidth);
    root.style.setProperty('--gather', s.toFixed(3));
  }
  setGather();
  window.addEventListener('resize', setGather);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(setGather);


  /* ---------- Sections ---------- */
  var views = {
    'home':        { c: '#1ea7ff', e: 'Home', t: 'Welcome back', p: "Pick up where you left off. Today's lessons, unread class notes and your next deadline are one tap away." },
    'gamification':{ c: '#ff2d75', e: 'Gamification', t: 'Streaks, badges and leaderboards', p: 'Earn points for finishing lessons and handing work in on time, then watch your class climb the board.' },
    'videos':      { c: '#b8ff1f', e: 'Videos', t: 'Every lesson, on replay', p: 'Rewatch any class, skip to the explanation you missed and save short clips for exam week.' },
    'my-classes':  { c: '#b44dff', e: 'My Classes', t: 'Your classes, by day', p: 'Timetable, teachers and materials for each subject, all in the order your week actually runs.' },
    'assignments': { c: '#ffa11a', e: 'Assignments', t: 'Due, done and graded', p: 'See what is due this week, what you have already submitted and what your teachers have marked.' }
  };
  var view = document.getElementById('view');

  /* Smoothly tween the page accent itself so all gradient layers flow between sections. */
  var accentAnim = 0;
  function colorToRgb(c) {
    c = (c || '').trim();
    var m;
    if ((m = c.match(/^#([0-9a-f]{6})$/i))) {
      var n = parseInt(m[1], 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    if ((m = c.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i))) {

    }
    return null;
  }
  function animateAccent(toColor) {
    cancelAnimationFrame(accentAnim);
    var from = colorToRgb(getComputedStyle(root).getPropertyValue('--accent')) || colorToRgb(toColor);
    var to = colorToRgb(toColor);
    if (!from || !to || reduce) { root.style.setProperty('--accent', toColor); return; }
    var start = performance.now();
    var duration = 1250;
    function tick(now) {
      var t = Math.min(1, (now - start) / duration);
      /* smoothstep gives the gradient a soft start and soft landing */
      var e = t * t * (3 - 2 * t);
      var r = Math.round(from[0] + (to[0] - from[0]) * e);
      var g = Math.round(from[1] + (to[1] - from[1]) * e);
      var b = Math.round(from[2] + (to[2] - from[2]) * e);
      root.style.setProperty('--accent', 'rgb(' + r + ',' + g + ',' + b + ')');
      if (t < 1) accentAnim = requestAnimationFrame(tick);
      else root.style.setProperty('--accent', toColor);
    }
    accentAnim = requestAnimationFrame(tick);
  }

  var viewSwapToken = 0;
  function show(id) {
    var v = views[id] || views.home;
    if (!views[id]) id = 'home';
    pills.forEach(function (p) {

    animateAccent(v.c);
    moveSlider(pillFor(id));

    var token = ++viewSwapToken;
    var textEls = Array.from(view.querySelectorAll('.t'));
    view.classList.remove('swap');

    if (reduce || !textEls.length) {
      document.getElementById('eyebrow').textContent = v.e;
      document.getElementById('title').textContent = v.t;
      document.getElementById('blurb').textContent = v.p;
      view.classList.add('swap');
      return;
    }

    Promise.all(textEls.map(function (el, i) {
      return el.animate([
        { opacity: 1, transform: 'translateY(0)', filter: 'blur(0)' },
        { opacity: 0, transform: 'translateY(-5px)', filter: 'blur(2px)' }
      ], {
        duration: 170 + i * 16,
        easing: 'cubic-bezier(.4,0,.6,1)',
        fill: 'forwards'
      }).finished.catch(function () {});
    })).then(function () {
      if (token !== viewSwapToken) return;
      document.getElementById('eyebrow').textContent = v.e;
      document.getElementById('title').textContent = v.t;
      document.getElementById('blurb').textContent = v.p;
      textEls.forEach(function (el) {
        el.getAnimations().forEach(function (a) { a.cancel(); });
        el.style.opacity = '';
        el.style.transform = '';
        el.style.filter = '';
      });
      void view.offsetWidth;
      view.classList.add('swap');
    });
  }

  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || 'home');
})();
</script>
