<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
<title>Classroom Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: nav pills centred along the top edge, theme switch pinned top right, one calm hero below that reacts to the active pill. */
@property --accent { syntax: '<color>'; inherits: true; initial-value: #1ea7ff; }
@property --hl { syntax: '<number>'; inherits: true; initial-value: 0; }

:root {
  --bg: #d8d3c5;
  --fg: #171a2c;
  --muted: #4a4e61;
  --ink-base: #0b0e1d;
  --rim: rgba(255, 255, 255, 0.75);
  --gloss: rgba(255, 255, 255, 0.7);
  --hl-a: 0.6;
  --goo-rest: 0.5;
  --night: 0;
  --switch-edge: rgba(23, 26, 44, 0.22);
  --switch-shadow: rgba(23, 26, 44, 0.28);
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --s: 0; /* scroll progress 0 -> 1, set from JS; the nav buttons and the theme switch both read it */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D173B;
    --fg: #eef1ff;
    --muted: #a3accf;
    --ink-base: #ffffff;
    --rim: rgba(255, 255, 255, 0.32);
    --gloss: rgba(255, 255, 255, 0.34);
    --hl-a: 0.28;
    --goo-rest: 0.62;
    --night: 1;
    --switch-edge: rgba(255, 255, 255, 0.22);
    --switch-shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D173B;
  --fg: #eef1ff;
  --muted: #a3accf;
  --ink-base: #ffffff;
  --rim: rgba(255, 255, 255, 0.32);
  --gloss: rgba(255, 255, 255, 0.34);
  --hl-a: 0.28;
  --goo-rest: 0.62;
  --night: 1;
  --switch-edge: rgba(255, 255, 255, 0.22);
  --switch-shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

html { height: 100%; }
body { min-height: 100%; }
:root { transition: --accent 1.35s cubic-bezier(.22,.72,.24,1); }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: clip;
}

/* Fallback colour transition (used when View Transitions are unavailable) */
.theming, .theming *, .theming *::before, .theming *::after {
  transition-property: background-color, color, border-color, box-shadow !important;
  transition-duration: 0.8s !important;
  transition-timing-function: ease !important;
}
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-old(root) { z-index: 1; }
::view-transition-new(root) { z-index: 2; }

/* ---------- Top bar ---------- */
.top {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 14px 12px;
  /* --s runs 0 -> 1 as the page scrolls (set from JS). Buttons shrink from their full size (*0) to the height of the theme switch (*1). */
  --pt0: 18px; --pt1: 14px; --pb0: 8px; --pb1: 14px;
  --pv0: 13px; --pv1: 3px; --pi0: 22px; --pi1: 12px; --fs0: 15px; --fs1: 12px;
  /* layout height lost while shrinking is handed back as margin, so the content below doesn't creep faster than the scroll */
  --comp: calc((var(--pt0) + 2 * var(--pv0) + var(--fs0) + 4px + var(--pb0)) - (var(--pt1) + 2 * var(--pv1) + var(--fs1) + 4px + var(--pb1)));
  padding-top: calc(var(--pt0) + (var(--pt1) - var(--pt0)) * var(--s));
  padding-bottom: calc(var(--pb0) + (var(--pb1) - var(--pb0)) * var(--s));
  margin-bottom: calc(var(--comp) * var(--s));
  position: sticky;
  top: 0;
  z-index: 50;
}
/* Full-width bar behind the nav: fades in gradually as the page scrolls (--bar is set from JS, 0 to 1) */
.top::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: 0; bottom: 0;
  left: 50%;
  width: 100vw;
  transform: translateX(-50%);
  pointer-events: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 88%, transparent), color-mix(in srgb, var(--bg) 66%, transparent));
  -webkit-backdrop-filter: blur(16px) saturate(1.5);
  backdrop-filter: blur(16px) saturate(1.5);
  box-shadow: 0 1px 0 var(--card-edge), 0 14px 30px -18px var(--card-shadow);
  opacity: var(--bar, 0);
  transition: opacity .45s ease;
}
.top nav { position: relative; max-width: 100%; }
nav ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(16px - 6px * var(--s, 0));
  margin: 0;
  padding: 0;
  list-style: none;
}


/* ---------- Frosted glass account menu, top right ---------- */
.mode {
  position: fixed;
  z-index: 100;
  right: max(18px, env(safe-area-inset-right, 0px));
  /* Match the nav row's own top padding as it compresses on scroll. */
  top: calc(18px - 4px * var(--s) + env(safe-area-inset-top, 0px));
}
.menu-trigger {
  display: grid;
  place-items: center;
  /* Same outer height as the nav pills: 45px at rest -> 22px when compact. */
  width: calc(45px - 23px * var(--s));
  height: calc(45px - 23px * var(--s));
  padding: 0;
  border: 0;
  border-radius: 999px;
  color: var(--fg);
  background: transparent;
  box-shadow: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s ease, color .2s ease;
}
.menu-trigger:hover { transform: translateY(-2px); }
.menu-trigger:active { transform: scale(.95); }
.menu-trigger:focus-visible, .menu-item:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.menu-trigger svg {
  width: calc(23px - 6px * var(--s));
  height: calc(23px - 6px * var(--s));
}
.menu-trigger .hamburger-line { transition: transform .25s ease, opacity .18s ease; transform-origin: center; }
.mode.open .hamburger-line:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.mode.open .hamburger-line:nth-child(2) { opacity: 0; }
.mode.open .hamburger-line:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
.menu-panel {
  position: absolute;
  top: calc(100% + 12px);
  right: 0;
  width: 238px;
  box-sizing: border-box;
  padding: 10px;
  border: 1px solid color-mix(in srgb, var(--rim) 55%, var(--card-edge));
  border-radius: 22px;
  color: var(--fg);
  background: color-mix(in srgb, var(--bg) 35%, transparent);
  -webkit-backdrop-filter: blur(28px) saturate(1.8);
  backdrop-filter: blur(28px) saturate(1.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 52px rgba(0,0,0,.17);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-9px) scale(.97);
  transform-origin: top right;
  transition: opacity .22s ease, transform .3s cubic-bezier(.2,.85,.3,1), visibility .22s;
}
.mode.open .menu-panel { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0) scale(1); }
.menu-label { padding: 9px 12px 10px; font: 600 11px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.menu-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 0;
  border-radius: 13px;
  background: transparent;
  color: var(--fg);
  font: 500 14px var(--font-body);
  text-align: left;
  cursor: pointer;
  transition: background .2s ease, transform .2s ease;
}
.menu-item:hover { background: color-mix(in srgb, var(--fg) 9%, transparent); transform: translateX(2px); }
.menu-item svg { width: 19px; height: 19px; flex-shrink: 0; opacity: .78; }
.menu-divider { height: 1px; margin: 8px 6px; background: var(--card-edge); }
.menu-theme { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px 10px; gap: 12px; }
.menu-theme-label { display: flex; align-items: center; gap: 10px; font: 500 14px var(--font-body); }
.menu-theme-label svg { width: 19px; height: 19px; opacity: .78; }
@media (max-width: 1100px) {
  .top { --pt0: 58px; }
  .mode { top: calc(58px - 44px * var(--s) + env(safe-area-inset-top, 0px)); }
}
@media (max-width: 640px) {
  .top { gap: 8px; --pt0: 58px; --pt1: 44px; --pb0: 8px; --pb1: 8px; --pv0: 9px; --pi0: 14px; --pi1: 10px; --fs0: 13px; --comp: 0px; }
  nav ul { gap: 6px 4px; }
  .mode { top: calc(58px - 14px * var(--s) + env(safe-area-inset-top, 0px)); }
  .menu-trigger {
    width: calc(39px - 17px * var(--s));
    height: calc(39px - 17px * var(--s));
  }
  .menu-panel { width: min(238px, calc(100vw - 36px)); }
}

/* ---------- Theme switch ---------- */
.switch {
  position: relative;
  width: 44px;
  height: 22px;
  padding: 0;
  border: 1px solid var(--switch-edge);
  border-radius: 999px;
  overflow: hidden;
  cursor: pointer;
  background: transparent;
  box-shadow: 0 6px 16px -6px var(--switch-shadow), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .3s cubic-bezier(.3,1.6,.5,1);
  -webkit-tap-highlight-color: transparent;
}
.switch:hover { transform: scale(1.06); }
.switch:active { transform: scale(.95); }
.switch:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.switch .track { position: absolute; inset: 0; }
.switch .day { background: linear-gradient(180deg, #6fc3ff, #c4e9ff); }
.switch .night { background: linear-gradient(180deg, #131d4d, #060a22); opacity: var(--night); transition: opacity .8s ease; }
.switch .ic { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; }
.switch .stars, .switch .clouds { position: absolute; inset: 0; transition: opacity .7s ease, transform .8s cubic-bezier(.3,1.3,.5,1); }
.switch .stars { opacity: var(--night); transform: translateY(calc((1 - var(--night)) * -10px)); }
.switch .stars i { position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px #fff; animation: twinkle 2.6s ease-in-out infinite alternate; }
.switch .stars i:nth-child(1) { left: 6px; top: 4px; }
.switch .stars i:nth-child(2) { left: 12px; top: 12px; width: 1.2px; height: 1.2px; animation-delay: -.8s; }
.switch .stars i:nth-child(3) { left: 4px; top: 13px; width: 1.2px; height: 1.2px; animation-delay: -1.5s; }
.switch .stars i:nth-child(4) { left: 17px; top: 5px; width: 1.2px; height: 1.2px; animation-delay: -2s; }
.switch .stars i:nth-child(5) { left: 10px; top: 7px; width: 1.2px; height: 1.2px; animation-delay: -1.1s; }
.switch .clouds { opacity: calc(1 - var(--night)); transform: translateY(calc(var(--night) * 12px)); }
.switch .clouds i { position: absolute; border-radius: 999px; background: #fff; }
.switch .clouds i:nth-child(1) { right: 4px; bottom: 2px; width: 16px; height: 6px; }
.switch .clouds i:nth-child(2) { right: 12px; bottom: 6px; width: 9px; height: 5px; }
@keyframes twinkle { from { opacity: .35; scale: .8; } to { opacity: 1; scale: 1.25; } }
.switch .knob {
  position: absolute;
  left: 2px;
  top: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
  transform: translateX(calc(var(--night) * 22px));
  transition: transform .4s cubic-bezier(.3,1.4,.5,1);
}
.switch .knob .ic { left: 50%; right: auto; margin: -5px 0 0 -5px; color: #1b1f33; opacity: 1; transition: opacity .3s ease; }
.switch .knob .ic.s { opacity: calc(1 - var(--night)); color: #f59e0b; }
.switch .knob .ic.m { opacity: var(--night); color: #3b4380; }

/* ---------- Liquid glass pills ---------- */
.pill {
  position: relative;
  display: block;
  isolation: isolate;
  border-radius: 999px;
  color: inherit;
  text-decoration: none;
  outline: none;
  transition: transform .4s cubic-bezier(.3,1.6,.5,1);
  -webkit-tap-highlight-color: transparent;
}
.pill:hover { z-index: 3; transform: scale(1.02); }
.pill:active { transform: scale(.96); }

.face {
  position: relative;
  display: block;
  overflow: hidden;
  padding: 13px 22px;
  border-radius: 999px;
  font: 600 15px/1 var(--font-body);
  letter-spacing: .01em;
  white-space: nowrap;
  color: color-mix(in srgb, var(--c) 38%, var(--ink-base));
  background:
    radial-gradient(72px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,calc(var(--hl) * var(--hl-a) * .6)), transparent 70%),
    linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--c) 12%, transparent));
  -webkit-backdrop-filter: blur(8px) saturate(1.7);
  backdrop-filter: blur(8px) saturate(1.7);
  border: 1px solid color-mix(in srgb, var(--c) 58%, transparent);
  box-shadow:
    inset 0 1px 0 var(--rim),
    inset 0 -10px 16px color-mix(in srgb, var(--c) 24%, transparent),
    0 8px 20px -6px color-mix(in srgb, var(--c) 60%, transparent);
  transition: --hl .35s ease, box-shadow .4s ease;
}
.pill:hover .face { --hl: 1; }
.pill:focus-visible .face { outline: 2px solid var(--fg); outline-offset: 3px; }
.pill[aria-current="page"] .face {
  box-shadow:
    inset 0 1px 0 var(--rim),
    inset 0 -10px 16px color-mix(in srgb, var(--c) 38%, transparent),
    0 8px 20px -6px color-mix(in srgb, var(--c) 70%, transparent);
}
.face::before {
  content: "";
  position: absolute;
  left: 9%; right: 9%; top: 1px;
  height: 46%;
  border-radius: 999px;
  background: linear-gradient(var(--gloss), rgba(255,255,255,0));
  pointer-events: none;
}
.face::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 32%, rgba(255,255,255,.5) 50%, transparent 68%);
  transform: translateX(-130%);
  transition: transform .9s ease;
  pointer-events: none;
}
.pill:hover .face::after { transform: translateX(-130%); }
.label { position: relative; z-index: 1; }

/* ---------- Nav: plain words at rest. The pill only exists on the active tab and arrives with the liquid drop ---------- */
.pill[data-view] .goo,
.pill[data-view] .face::before,
.pill[data-view] .face::after,
.pill[data-view] .ripple { display: none; }
.pill[data-view] .face {
  padding: calc(var(--pv0, 13px) + (var(--pv1, 3px) - var(--pv0, 13px)) * var(--s, 0)) calc(var(--pi0, 22px) + (var(--pi1, 12px) - var(--pi0, 22px)) * var(--s, 0));
  font-size: calc(var(--fs0, 15px) + (var(--fs1, 12px) - var(--fs0, 15px)) * var(--s, 0));
  background: transparent;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  border: 2px solid transparent;
  color: var(--fg);
  box-shadow: 0 3px 0 transparent;
  /* leaving: the pill melts away quickly as the drop pulls out of it */
  transition: background-color .15s ease, border-color .15s ease, color .2s ease, box-shadow .15s ease;
}
.pill[data-view]:hover { transform: translateY(-2px); }
.pill[data-view]:not([aria-current="page"]):hover .face { color: color-mix(in srgb, var(--c) 45%, var(--fg)); }
/* Active tab: the solid pill fills in once the liquid drop arrives (.5s delay) */
.pill[data-view][aria-current="page"] .face {
  background-color: var(--c);
  border-color: var(--c);
  color: #0b0e1d;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 60%, #0b0e1d);
  transition: background-color .35s ease .5s, border-color .35s ease .5s, color .35s ease .5s, box-shadow .3s ease .5s;
}
/* Press: the word dips */
.pill[data-view]:active { transform: translateY(3px); }
.pill[data-view]:active .face,
.pill[data-view][aria-current="page"]:active .face { box-shadow: 0 0 0 transparent; }

/* Liquid layer: base pill + blobs, merged by the goo filter */
.goo {
  position: absolute;
  inset: -18px;
  z-index: -1;
  pointer-events: none;
  filter: blur(9px);
  opacity: calc(var(--goo-rest) * .45);
  transition: opacity .6s ease;
}
.pill:hover .goo { opacity: .55; }
.pill[aria-current="page"] .goo { opacity: .55; }
.goo i { position: absolute; border-radius: 50%; background: var(--c); }
.goo .b, .goo .follow { display: none; }
.goo .base { inset: 18px; border-radius: 999px; }
.goo .b {
  left: 50%; top: 50%;
  width: var(--s); height: var(--s);
  transform: translate(-50%, -50%) scale(.25);
  transition:
    left .6s cubic-bezier(.3,1.7,.5,1) var(--d),
    top .6s cubic-bezier(.3,1.7,.5,1) var(--d),
    transform .6s cubic-bezier(.3,1.7,.5,1) var(--d);
}
.pill:hover .goo .b {
  left: var(--x); top: var(--y);
  transform: translate(-50%, -50%) scale(1);
  animation: wob 2.4s ease-in-out var(--d) infinite alternate;
}
.goo .follow {
  left: 0; top: 0;
  width: 46px; height: 46px;
  margin: -23px 0 0 -23px;
  transform: translate(var(--fx, 60px), var(--fy, 37px)) scale(0);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
}
.pill:hover .goo .follow { transform: translate(var(--fx, 60px), var(--fy, 37px)) scale(1); }
@keyframes wob {
  0%   { translate: 0 0; scale: 1; }
  50%  { translate: 2px -3px; scale: 1.14; }
  100% { translate: -3px 2px; scale: .9; }
}

/* Click ripple, clipped inside the pill */
.ripple {
  position: absolute;
  left: var(--rx); top: var(--ry);
  width: var(--rs); height: var(--rs);
  margin: calc(var(--rs) / -2) 0 0 calc(var(--rs) / -2);
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.9) 0, color-mix(in srgb, var(--c) 72%, transparent) 34%, transparent 68%);
  transform: scale(0);
  opacity: .9;
  animation: ripple .8s cubic-bezier(.2,.7,.3,1) forwards;
}
.ripple.ripple-ring {
  background: none;
  border: 2px solid color-mix(in srgb, var(--c) 70%, #fff);
  animation-duration: 1s;
  animation-delay: .08s;
}
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* ---------- Uzio: all five neon colours as a slow liquid ---------- */
.pill.brand .face { font-weight: 600; letter-spacing: .05em; }
.brand .face::before, .brand .face::after { z-index: 1; }
.brand .label { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- Ask Uzio: a 3D glass orb with a face that follows the cursor ---------- */
.ask {
  position: fixed;
  z-index: 80;
  right: max(10px, env(safe-area-inset-right, 0px));
  bottom: calc(6px + env(safe-area-inset-bottom, 0px));
}
.uzio-orb {
  display: flex;
  align-items: center;
  gap: 0;
  color: var(--fg);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  cursor: pointer;
}
.uzio-orb canvas {
  display: block;
  width: 128px;
  height: 128px;
  animation: orbfloat 4.2s ease-in-out infinite;
  transition: transform .45s cubic-bezier(.3,1.6,.5,1);
}
.uzio-orb:hover canvas, .uzio-orb:focus-visible canvas { transform: scale(1.08); }
.uzio-orb:active canvas { transform: scale(.94); }
.uzio-orb { position: relative; }
/* The pill stays hidden until you hover (or keyboard-focus) the orb, then pops out at its top-left */
.orb-label {
  position: absolute;
  z-index: 2; /* in front of the orb */
  right: calc(100% - 42px);
  bottom: calc(100% - 36px);
  padding: 10px 16px;
  border-radius: 999px;
  font: 600 14px/1 var(--font-body);
  letter-spacing: .02em;
  white-space: nowrap;
  color: var(--fg);
  background: var(--card);
  border: 2px solid var(--card-edge);
  box-shadow: 0 3px 0 var(--card-shadow);
  -webkit-backdrop-filter: blur(10px) saturate(1.5);
  backdrop-filter: blur(10px) saturate(1.5);
  opacity: 0;
  pointer-events: none;
  transform: translate(16px, 12px) scale(.8);
  transform-origin: right bottom;
  transition: opacity .25s ease, transform .45s cubic-bezier(.3,1.5,.5,1);
}
.uzio-orb:hover .orb-label, .uzio-orb:focus-visible .orb-label { opacity: 1; transform: translate(0, 0) scale(1); }
.uzio-orb:focus-visible .orb-label { outline: 2px solid var(--fg); outline-offset: 3px; }
.uzio-orb.no-gl canvas { background: conic-gradient(from 0deg, #1ea7ff, #ff2d75, #b8ff1f, #b44dff, #ffa11a, #1ea7ff); clip-path: circle(37%); }
@keyframes orbfloat { 50% { transform: translateY(-5px); } }
@media (max-width: 520px) {
  .uzio-orb canvas { width: 104px; height: 104px; }

<script>
(function () {
  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Account dropdown ---------- */
  var menu = document.getElementById('accountMenu');
  var menuTrigger = document.getElementById('menuTrigger');
  var menuPanel = document.getElementById('menuPanel');
  function setMenu(open) {
    menu.classList.toggle('open', open);
    menuTrigger.setAttribute('aria-expanded', String(open));
    menuTrigger.setAttribute('aria-label', open ? 'Close account menu' : 'Open account menu');
    menuPanel.inert = !open;
  }
  menuTrigger.addEventListener('click', function () { setMenu(!menu.classList.contains('open')); });
  document.addEventListener('pointerdown', function (e) {
    if (!menu.contains(e.target)) setMenu(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('open')) {
      setMenu(false);
      menuTrigger.focus();
    }
  });
  menuPanel.querySelectorAll('[data-menu-action]').forEach(function (button) {
    button.addEventListener('click', function () {
      setMenu(false);
      toast(button.getAttribute('data-menu-action') + ' page coming soon');
    });
  });

  /* ---------- Theme switch ---------- */
  var toggle = document.getElementById('themeToggle');
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function sync() { toggle.setAttribute('aria-checked', String(isDark())); }
  sync();

  toggle.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    var apply = function () { root.setAttribute('data-theme', next); sync(); };
    if (document.startViewTransition && !reduce) {
      var r = toggle.getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2;
      var end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      var vt = document.startViewTransition(apply);
      vt.ready.then(function () {
        root.animate(
          { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
          { duration: 900, easing: 'cubic-bezier(.65,0,.25,1)', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(function () {});
    } else {
      root.classList.add('theming');
      apply();
      setTimeout(function () { root.classList.remove('theming'); }, 900);
    }
  });

  /* ---------- Pills: liquid hover + inner ripple ---------- */
  var pills = document.querySelectorAll('.pill[data-view]');

  function track(p, e) {
    var f = p.querySelector('.face').getBoundingClientRect();
    var g = p.querySelector('.goo');
    var gr = g.getBoundingClientRect();
    p.style.setProperty('--mx', (e.clientX - f.left) + 'px');
    p.style.setProperty('--my', (e.clientY - f.top) + 'px');
    g.style.setProperty('--fx', (e.clientX - gr.left) + 'px');
    g.style.setProperty('--fy', (e.clientY - gr.top) + 'px');
  }

  function ripple(p, clientX, clientY, center) {
    var face = p.querySelector('.face');
    var r = face.getBoundingClientRect();
    var x = center ? r.width / 2 : clientX - r.left;
    var y = center ? r.height / 2 : clientY - r.top;
    var size = Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y)) * 2.2;
    ['', 'ripple-ring'].forEach(function (cls) {
      var s = document.createElement('span');
      s.className = 'ripple' + (cls ? ' ' + cls : '');
      s.style.setProperty('--rx', x + 'px');
      s.style.setProperty('--ry', y + 'px');
      s.style.setProperty('--rs', size + 'px');
      s.addEventListener('animationend', function () { s.remove(); });
      face.appendChild(s);
    });
  }

  document.querySelectorAll('.pill').forEach(function (p) {
    p.addEventListener('pointerenter', function (e) { track(p, e); });
    p.addEventListener('pointermove', function (e) { track(p, e); });
    p.addEventListener('pointerdown', function (e) { ripple(p, e.clientX, e.clientY, false); });
    p.addEventListener('click', function (e) {
      e.preventDefault();
      if (e.detail === 0) ripple(p, 0, 0, true); /* keyboard activation */
      if (p.classList.contains('brand')) return;
      var id = p.getAttribute('data-view');
      if (location.hash !== '#' + id) location.hash = id; else show(id);
    });
  });

  /* ---------- Sliding highlight ---------- */
  var slider = document.querySelector('.slider');
  var cur = null, activePill = null;
  function pillFor(id) {
    for (var i = 0; i < pills.length; i++) if (pills[i].getAttribute('data-view') === id) return pills[i];
    return pills[0];
  }
  function geom(p) { return { l: p.offsetLeft, t: p.offsetTop, w: p.offsetWidth, h: p.offsetHeight }; }
  function box(g) { return { left: g.l + 'px', top: g.t + 'px', width: g.w + 'px', height: g.h + 'px' }; }
  var dw = document.querySelector('.dropwrap');
  var dFrom = dw.querySelector('.d-from');
  var dHead = dw.querySelector('.d-head');
  var dBridge = dw.querySelector('.d-bridge');
  var OFF = 24, anims = [], ringTimer = 0, curColor = null;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function rect(cx, cy, w, h, col, off) {
    var o = { left: (cx - w / 2) + 'px', top: (cy - h / 2) + 'px', width: w + 'px', height: h + 'px' };
    if (col) o.backgroundColor = col;
    if (off != null) o.offset = off;
    return o;
  }
  function cancelDrop() {
    anims.forEach(function (a) { a.cancel(); });
    anims = [];
    clearTimeout(ringTimer);
    slider.classList.remove('moving');
  }

  /* A drop pulls away from the old pill, stretches a neck, and lands in the new one, shifting colour on the way. */
  function runDrop(f, g, c0, c1) {
    var D = 950;
    var fx = f.l + f.w / 2 + OFF, fy = f.t + f.h / 2 + OFF;
    var gx = g.l + g.w / 2 + OFF, gy = g.t + g.h / 2 + OFF;
    var dx = gx - fx, dy = gy - fy;
    var dist = Math.max(1, Math.hypot(dx, dy));
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var bh = g.h * 0.7;
    dw.style.setProperty('--c0', c0);
    dw.style.setProperty('--c1', c1);
    slider.classList.add('moving');

    dBridge.style.left = fx + 'px';
    dBridge.style.top = (fy - bh / 2) + 'px';
    dBridge.style.width = dist + 'px';
    dBridge.style.height = bh + 'px';
    var rot = 'rotate(' + ang + 'deg) ';

    anims.push(dw.animate(
      [{ opacity: 0 }, { opacity: 0.92, offset: 0.06 }, { opacity: 0.92, offset: 0.78 }, { opacity: 0 }],
      { duration: D }
    ));
    anims.push(dFrom.animate([
      rect(fx, fy, f.w, f.h, c0),
      rect(lerp(fx, gx, 0.1), lerp(fy, gy, 0.1), f.h * 1.1, f.h * 0.85, c0, 0.45),
      rect(lerp(fx, gx, 0.26), lerp(fy, gy, 0.26), 4, 4, c0)
    ], { duration: D, easing: 'ease-in-out' }));
    anims.push(dBridge.animate([
      { transform: rot + 'scale(0,1)' },
      { transform: rot + 'scale(0.75,1)', offset: 0.3 },
      { transform: rot + 'scale(1,0.6)', offset: 0.65 },
      { transform: rot + 'scale(1,0)' }
    ], { duration: D, easing: 'ease-in-out' }));
    anims.push(dHead.animate([
      rect(fx, fy, f.h * 0.8, f.h * 0.8, c0),
      rect(lerp(fx, gx, 0.72), lerp(fy, gy, 0.72), g.h * 1.5, g.h * 0.88, null, 0.55),
      rect(gx, gy, g.w, g.h, c1)
    ], { duration: D, easing: 'cubic-bezier(.5,.05,.25,1.12)' }));

    ringTimer = setTimeout(function () { slider.classList.remove('moving'); }, D * 0.72);
  }

  function moveSlider(p) {
    if (activePill && cur) cur = geom(activePill);
    activePill = p;
    var g = geom(p);
    var col = p.style.getPropertyValue('--c').trim();
    cancelDrop();
    if (cur && curColor && !reduce && (cur.l !== g.l || cur.t !== g.t)) runDrop(cur, g, curColor, col);
    var b = box(g);
    slider.style.left = b.left; slider.style.top = b.top;
    slider.style.width = b.width; slider.style.height = b.height;
    cur = g;
    curColor = col;
  }
  function resettle() { if (activePill) { cur = null; moveSlider(activePill); } }
  window.addEventListener('resize', resettle);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resettle);

  /* ---------- Uzio: size the glow so it gathers to about the pill's width ---------- */
  var askPill = document.querySelector('.ask a');
  function setGather() {
    if (!askPill) return;
    var s = Math.min(1, (askPill.offsetWidth * 1.6) / window.innerWidth);
    root.style.setProperty('--gather', s.toFixed(3));
    var r = askPill.getBoundingClientRect();
    root.style.setProperty('--gx', Math.round(r.left + r.width / 2) + 'px');
  }
  setGather();
  window.addEventListener('resize', setGather);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(setGather);


  /* ---------- Sections ---------- */
  var views = {
    'home':        { c: '#1ea7ff', e: 'Home', t: 'Hey Uzay 👋', p: 'Your streak is alive. Finish two lessons today to keep it going and grab bonus XP.' },
    'gamification':{ c: '#ff2d75', e: 'Gamification', t: 'Level up your week', p: 'Earn XP for lessons, videos and handing work in on time. Collect badges and climb your class board.' },
    'videos':      { c: '#b8ff1f', e: 'Videos', t: 'Watch it again, get it faster', p: 'Every lesson on replay. Skip to the part you missed and save short clips for test week.' },
    'my-classes':  { c: '#b44dff', e: 'My Classes', t: 'Your week, class by class', p: "See what's on each day, who's teaching and what you need to bring." },
    'assignments': { c: '#ffa11a', e: 'Assignments', t: "What's due?", p: 'Hand work in on time for bonus XP. Your teachers’ grades show up here too.' }
  };
  var view = document.getElementById('view');

  /* Smoothly tween the page accent itself so all gradient layers flow between sections. */
  var accentAnim = 0;
  function colorToRgb(c) {
    c = (c || '').trim();
    var m;
    if ((m = c.match(/^#([0-9a-f]{6})$/i))) {
      var n = parseInt(m[1], 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    if ((m = c.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i))) {
      return [Number(m[1]), Number(m[2]), Number(m[3])];
    }
    return null;
  }
  function animateAccent(toColor) {
    cancelAnimationFrame(accentAnim);
    var from = colorToRgb(getComputedStyle(root).getPropertyValue('--accent')) || colorToRgb(toColor);
    var to = colorToRgb(toColor);
    if (!from || !to || reduce) { root.style.setProperty('--accent', toColor); return; }
    var start = performance.now();
    var duration = 1250;
    function tick(now) {
      var t = Math.min(1, (now - start) / duration);
      /* smoothstep gives the gradient a soft start and soft landing */
      var e = t * t * (3 - 2 * t);
      var r = Math.round(from[0] + (to[0] - from[0]) * e);
      var g = Math.round(from[1] + (to[1] - from[1]) * e);
      var b = Math.round(from[2] + (to[2] - from[2]) * e);
      root.style.setProperty('--accent', 'rgb(' + r + ',' + g + ',' + b + ')');
      if (t < 1) accentAnim = requestAnimationFrame(tick);
      else root.style.setProperty('--accent', toColor);
    }
    accentAnim = requestAnimationFrame(tick);
  }

  var viewSwapToken = 0;
  function show(id) {
    var v = views[id] || views.home;
    if (!views[id]) id = 'home';
    pills.forEach(function (p) {
      if (p.getAttribute('data-view') === id) p.setAttribute('aria-current', 'page');
      else p.removeAttribute('aria-current');
    });
    animateAccent(v.c);
    moveSlider(pillFor(id));
    renderPanel(id);

    var token = ++viewSwapToken;
    var textEls = Array.from(view.querySelectorAll('.t'));
    view.classList.remove('swap');

    if (reduce || !textEls.length) {
      document.getElementById('eyebrow').textContent = v.e;
      document.getElementById('title').textContent = v.t;
      document.getElementById('blurb').textContent = v.p;
      view.classList.add('swap');
      return;
    }

    Promise.all(textEls.map(function (el, i) {
      return el.animate([
        { opacity: 1, transform: 'translateY(0)', filter: 'blur(0)' },
        { opacity: 0, transform: 'translateY(-5px)', filter: 'blur(2px)' }
      ], {
        duration: 170 + i * 16,
        easing: 'cubic-bezier(.4,0,.6,1)',
        fill: 'forwards'
      }).finished.catch(function () {});
    })).then(function () {
      if (token !== viewSwapToken) return;

    var items = ASG.filter(function (a) { return a.st === ST.tab; });
    if (ST.tab === 'todo') items.sort(function (a, b) { return a.off - b.off; });
    var body = items.length ? '<ul class="list">' + items.map(asgItem).join('') + '</ul>' : '<div class="empty">' + MASCOT + '<b>' + (ST.tab === 'todo' ? 'All caught up! 🎉' : 'Nothing here yet') + '</b>' + (ST.tab === 'todo' ? 'Nothing is due. Go watch something fun.' : 'Check back soon.') + '</div>';
    return '<div class="dash">' +
      stat(cnt.todo, 'To do', '#ff2d75') + stat(cnt.sub, 'Handed in', '#2dd4bf') + stat(cnt.graded, 'Graded', '#1ea7ff') + stat('+' + xpLeft, 'XP up for grabs', '#ffa11a') +
      '<div class="s12"><div class="seg" role="group" aria-label="Assignment status">' + tabs + '</div></div>' +
      '<div class="s12">' + body + '</div>' +
      '</div>';
  }

  var RENDER = { 'home': rHome, 'gamification': rGame, 'videos': rVideos, 'my-classes': rClasses, 'assignments': rAssign };
  function renderPanel(id, quiet) {
    curView = id;
    var f = document.activeElement, key = f && f.getAttribute ? f.getAttribute('data-key') : null;
    panel.classList.toggle('quiet', !!quiet);
    panel.innerHTML = (RENDER[id] || rHome)();
    Array.prototype.forEach.call(panel.querySelectorAll('.dash > *'), function (el, i) { el.style.animationDelay = (i * 55) + 'ms'; });
    if (key) { var n = panel.querySelector('[data-key="' + key + '"]'); if (n) n.focus({ preventScroll: true }); }
  }

  /* toast */
  var toastEl = document.createElement('div');
  toastEl.className = 'toast';
  toastEl.setAttribute('role', 'status');
  document.body.appendChild(toastEl);
  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act'), v = b.getAttribute('data-v'), id = +b.getAttribute('data-id');
    if (act === 'vf') ST.vf = v;
    else if (act === 'day') ST.day = v;
    else if (act === 'tab') ST.tab = v;
    else if (act === 'save') { if (ST.saved[id]) delete ST.saved[id]; else ST.saved[id] = true; }
    else if (act === 'play') {
      var vv = VID.filter(function (x) { return x.id === id; })[0];
      toast('▶ ' + vv.n + ' (player coming soon)');
      return;
    } else if (act === 'done') {
      var a = ASG.filter(function (x) { return x.id === id; })[0];
      if (a && a.st === 'todo') {
        a.st = 'sub'; a.on = 'today';
        var up = addXp(a.xp);
        toast(up ? '🎉 Level ' + ST.level + '! +' + a.xp + ' XP' : '+' + a.xp + ' XP · nice work!');
      }
    }
    renderPanel(curView, true);
  });

  /* ---------- Uzio orb: raw WebGL, no libraries ---------- */
  (function () {
    var link = document.querySelector('.uzio-orb');
    var cv = document.getElementById('uzioOrb');
    if (!link || !cv) return;
    var gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
    if (!gl) { link.classList.add('no-gl'); return; }

    var VS = 'attribute vec2 a;varying vec2 vUv;void main(){vUv=a*.5+.5;gl_Position=vec4(a,0.,1.);}';
    var FS = [
'precision highp float;',
'uniform vec2 uRes;uniform float uTime;uniform vec2 uGaze;uniform float uBlink;uniform float uHappy;uniform float uSpin;',
'varying vec2 vUv;',
'const vec3 C0=vec3(.118,.655,1.);const vec3 C1=vec3(1.,.176,.459);const vec3 C2=vec3(.722,1.,.122);',
'const vec3 C3=vec3(.706,.302,1.);const vec3 C4=vec3(1.,.631,.102);',
/* five coloured light blobs drifting around inside the ball */
'vec3 field(vec3 s,float t,out float ws){',
'  vec3 acc=vec3(0.);ws=0.;',
'  for(int i=0;i<5;i++){',
'    float fi=float(i);',
'    vec3 c=.58*vec3(sin(t*.55+fi*1.26+.3),cos(t*.47+fi*2.1),sin(t*.63+fi*.93+1.1));',
'    vec3 d=s-c;float w=exp(-dot(d,d)*3.0);',
'    vec3 col=i==0?C0:(i==1?C1:(i==2?C2:(i==3?C3:C4)));',
'    acc+=col*w;ws+=w;',
'  }',
'  return acc;',
'}',
'void main(){',
'  vec2 p=vUv*2.-1.;',
'  float t=uTime;',
'  float R=.74*(1.+.012*sin(t*1.7));',
'  float r=length(p);',
'  float aa=3./uRes.y;',
/* outer halo */
'  float ws;',
'  vec3 hacc=field(vec3(p/R*.62,0.),t,ws);',
'  vec3 hcol=hacc/(ws+.2);',
'  float halo=exp(-max(r-R,0.)*7.5)*.36*smoothstep(0.,.25,ws+.15)*smoothstep(.98,.8,r);',
'  vec3 outc=hcol*halo;float outa=halo*.8;',
'  float edge=1.-smoothstep(R-aa,R+aa,r);',
'  if(edge<=0.){gl_FragColor=vec4(outc,outa);return;}',
/* sphere surface */
'  vec2 q=p/R;float rr=min(length(q),1.);float z=sqrt(max(1.-rr*rr,0.));',
'  vec3 n=vec3(q,z);',
'  vec3 s=vec3(q*.95,z*.55-.25);s.xy+=n.xy*.12*sin(t*.8);',
'  float cs=cos(uSpin),sn=sin(uSpin);s.xz=vec2(cs*s.x+sn*s.z,-sn*s.x+cs*s.z);',
'  vec3 acc=field(s,t,ws);',
'  vec3 inner=acc/(ws+.16);',
'  float glow=clamp(ws,0.,1.5);',
'  vec3 base=mix(vec3(.10,.12,.32),inner,smoothstep(0.,.8,glow));',
'  vec3 c=base*(.78+.5*pow(z,.8))+inner*.12*glow;',
'  float fres=pow(1.-z,2.4);',
'  c=mix(c,mix(vec3(1.),inner,.45),fres*.6);',
'  c=mix(c,vec3(dot(c,vec3(.3,.59,.11))),.22);',
'  c=mix(c,vec3(.80,.83,.96),.2);',
/* face: a frame that turns toward the cursor */
'  vec3 f=normalize(vec3(uGaze.x*.62,uGaze.y*.5,1.));f=vec3(cs*f.x+sn*f.z,f.y,-sn*f.x+cs*f.z);',
'  vec3 rt=normalize(cross(vec3(0.,1.,0.),f));vec3 up=cross(f,rt);',
'  float u=dot(n,rt),v=dot(n,up),w=dot(n,f);',
'  float fm=smoothstep(.12,.42,w);',
'  vec3 ink=vec3(.055,.065,.16);',
'  float bl=max(uBlink,.07);',
'  for(int k=0;k<2;k++){',
'    float sx=k==0?-1.:1.;',
'    vec2 b=vec2(u-sx*.46,v+.045)/vec2(.115,.068);',
'    c=mix(c,vec3(1.,.38,.55),exp(-dot(b,b)*1.1)*.55*fm);',
'  }',
'  for(int k=0;k<2;k++){',
'    float sx=k==0?-1.:1.;',
'    vec2 e=vec2(u-sx*.29,v-.105);',
'    float d=length(e/vec2(.098,.145*bl));',
'    float ea=smoothstep(1.,.88,d)*fm;',
'    c=mix(c,ink,ea);',
'    float h1=smoothstep(1.,.6,length((e-vec2(-.024,.052*bl))/vec2(.034,.034*bl+.001)));',
'    float h2=smoothstep(1.,.6,length((e-vec2(.03,-.05*bl))/vec2(.017,.017*bl+.001)));',
'    c=mix(c,vec3(1.),max(h1,h2*.85)*ea*smoothstep(.2,.6,bl));',
'  }',
/* mouth: small smile that opens into a happy "o" on hover or click */
'  vec2 m=vec2(u,v+.185);',
'  float s1=m.x/.125;',
'  float line=smoothstep(.019,.011,abs(m.y-(.03*s1*s1-.03)))*smoothstep(1.,.82,abs(s1));',
'  vec2 me=m-vec2(0.,-.035);',
'  float od=length(me/vec2(.07+.02*uHappy,.012+.06*uHappy));',
'  float open=smoothstep(1.,.86,od);',
'  float mk=mix(line,open,smoothstep(.12,.5,uHappy))*fm;',
'  c=mix(c,ink,mk);',
'  float tongue=open*smoothstep(.1,.5,uHappy)*smoothstep(-.012,-.04,me.y)*fm;',
'  c=mix(c,vec3(1.,.42,.58),tongue);',
/* gloss */
'  c+=vec3(1.)*smoothstep(1.,0.,length((q-vec2(-.4,.5))/vec2(.3,.14)))*.6;',
'  c+=vec3(1.)*smoothstep(1.,0.,length((q-vec2(.42,-.55))/vec2(.2,.06)))*.22;',
'  c=clamp(c,0.,1.);',
'  vec3 rgb=outc*(1.-edge)+c*edge;',
'  float a=outa*(1.-edge)+edge;',
'  gl_FragColor=vec4(rgb,a);',
'}'
    ].join('\n');

    function sh(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
      return s;
    }
    var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) { link.classList.add('no-gl'); return; }
    var pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { link.classList.add('no-gl'); return; }
    gl.useProgram(pr);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(pr, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var U = {};
    ['uRes', 'uTime', 'uGaze', 'uBlink', 'uHappy', 'uSpin'].forEach(function (n) { U[n] = gl.getUniformLocation(pr, n); });
    gl.clearColor(0, 0, 0, 0);

    function fit() {
      var d = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.round(cv.clientWidth * d);
      if (w && cv.width !== w) { cv.width = w; cv.height = w; }
      gl.viewport(0, 0, cv.width, cv.height);
    }
    window.addEventListener('resize', fit);
    fit();

    /* cursor tracking: the face turns toward the pointer anywhere on the page */
    var px = null, py = null, lastMove = 0, hov = 0, hovT = 0, press = 0;
    window.addEventListener('pointermove', function (e) { px = e.clientX; py = e.clientY; lastMove = performance.now(); }, { passive: true });
    window.addEventListener('pointerdown', function (e) { px = e.clientX; py = e.clientY; lastMove = performance.now(); }, { passive: true });
    link.addEventListener('pointerenter', function () { hovT = 1; });
    link.addEventListener('pointerleave', function () { hovT = 0; });
    link.addEventListener('focus', function () { hovT = 1; });
    link.addEventListener('blur', function () { hovT = 0; });
    link.addEventListener('click', function (e) {
      e.preventDefault();
      press = 1;
      toast('✨ Uzio says hi! The AI helper is coming soon.');
      window.dispatchEvent(new CustomEvent('uzio:open')); /* hook the AI chat up here */
    });

    var gx = 0, gy = 0, blinkAt = 1800, blinkStart = -1, last = performance.now(), T = reduce ? 3 : 0;
    var ease = function (x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
    var c01 = function (x) { return Math.max(0, Math.min(1, x)); };
    var PI = Math.PI, sin = Math.sin;

    /* Little moves. Each one tweaks the orb for progress ph (0..1) through the object o. */
    var MOVES = {
      /* quick spin with a hop: the face turns away, goes round and comes back */
      spin:   { d: 1050, f: function (ph, o, m) { o.spin = m.dir * PI * 2 * ease(ph); o.jy = -15 * sin(PI * c01(ph * 1.05)); o.sy = 1 + .07 * sin(PI * ph); o.sx = 1 - .04 * sin(PI * ph); o.happy = .8 * sin(PI * ph); } },
      /* bored: a happy shimmy */
      wiggle: { d: 900,  f: function (ph, o) { o.rot = 10 * sin(ph * PI * 6) * (1 - ph); o.happy = .55 * sin(PI * ph); } },
      /* bored: a big yawn with eyes squeezed shut */
      yawn:   { d: 2300, f: function (ph, o) { var b = c01(sin(PI * ph) * 2.2); o.blink = 1 - .93 * b; o.happy = b; o.sy = 1 + .05 * b; o.sx = 1 - .03 * b; o.gyo = .25 * b; } },
      /* bored: looks left, right and up, as if watching something */
      look:   { d: 2800, f: function (ph, o) { o.gx = sin(ph * PI * 2) * .95; o.gy = .25 * sin(ph * PI * 4) + .1; } },
      /* bored: two little hops */
      bounce: { d: 1200, f: function (ph, o) { var a = Math.abs(sin(ph * PI * 2)); o.jy = -13 * a; o.sy = 1 + .06 * a - .05 * (1 - a) * sin(PI * ph); o.sx = 1 - (o.sy - 1) * .6; o.happy = .6 * sin(PI * ph); } },
      /* bored: gets sleepy, eyes droop, head nods, then wakes up */
      sleepy: { d: 3200, f: function (ph, o) { var s = sin(PI * ph); o.blink = 1 - .88 * s * s; o.gyo = -.45 * s; o.rot = 4 * sin(ph * PI * 2) * s; } }
    };
    var BORED = ['wiggle', 'yawn', 'look', 'bounce', 'sleepy'];
    var mv = null, lastBored = '';
    var nextSpin = last + 10000 + Math.random() * 6000, nextBored = last + 8000;
    function start(name, now) { mv = { n: name, t0: now, dir: Math.random() < .5 ? 1 : -1 }; }

    function frame(now) {
      requestAnimationFrame(frame);
      if (document.hidden) { last = now; return; }
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!reduce) T += dt;

      /* schedule: a spin every 10-18s, and when nobody has touched it for 6s it gets bored */
      if (!reduce && !mv && hov < .2 && press === 0) {
        if (now > nextSpin) { start('spin', now); nextSpin = now + 10000 + Math.random() * 8000; }
        else if (now - lastMove > 6000 && now > nextBored) {
          var pool = BORED.filter(function (n) { return n !== lastBored; });
          lastBored = pool[Math.floor(Math.random() * pool.length)];
          start(lastBored, now);
          nextBored = now + 5000 + Math.random() * 5000;
        }
      }
      var o = { spin: 0, jy: 0, sx: 1, sy: 1, rot: 0, happy: 0, blink: 1, gx: null, gy: null, gyo: 0 };
      if (mv) {
        var ph = (now - mv.t0) / MOVES[mv.n].d;
        if (ph >= 1) mv = null; else MOVES[mv.n].f(ph, o, mv);
      }

      var tx = 0, ty = 0;
      if (px !== null && now - lastMove < 5000) {
        var r = cv.getBoundingClientRect();
        var dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height / 2);
        var dist = Math.hypot(dx, dy) || 1, m = Math.min(1, dist / 240);
        tx = dx / dist * m; ty = -dy / dist * m;
      } else if (!reduce) { /* idle: look around lazily */
        tx = sin(T * .5) * .55; ty = sin(T * .37 + 1) * .3;
      }
      if (o.gx !== null) { tx = o.gx; ty = o.gy; }
      ty += o.gyo;
      var k = 1 - Math.exp(-dt * 9);
      gx += (tx - gx) * k; gy += (ty - gy) * k;
      hov += (hovT - hov) * (1 - Math.exp(-dt * 10));
      press = Math.max(0, press - dt * 2.2);
      var happy = Math.min(1, hov * .75 + press + o.happy);
      var blink = 1;
      if (!reduce) {
        if (blinkStart < 0 && now > blinkAt) blinkStart = now;
        if (blinkStart >= 0) {
          var bp = (now - blinkStart) / 170;
          if (bp >= 1) { blinkStart = -1; blinkAt = now + 1800 + Math.random() * 3200; }
          else blink = 1 - sin(PI * bp);
        }
      }
      blink = Math.min(blink, o.blink);
      cv.style.translate = '0 ' + o.jy.toFixed(2) + 'px';
      cv.style.scale = o.sx.toFixed(3) + ' ' + o.sy.toFixed(3);
      cv.style.rotate = o.rot.toFixed(2) + 'deg';
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(U.uRes, cv.width, cv.height);
      gl.uniform1f(U.uTime, T);
      gl.uniform2f(U.uGaze, gx, gy);
      gl.uniform1f(U.uBlink, blink);
      gl.uniform1f(U.uHappy, happy);
      gl.uniform1f(U.uSpin, o.spin);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    requestAnimationFrame(frame);
  })();

  /* ---------- Nav bar fades in as the page scrolls ---------- */
  var topEl = document.querySelector('.top');
  function onScroll() {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    topEl.style.setProperty('--bar', Math.min(1, Math.max(0, y / 160)).toFixed(3));
    root.style.setProperty('--s', Math.min(1, Math.max(0, y / 200)).toFixed(3));
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || 'home');
})();
</script>

</body></html>
